<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ختمتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132821;
    --panel:#1B362D;
    --panel-2:#20402F;
    --parchment:#EFE6D2;
    --parchment-dim:#C9BFA9;
    --gold:#C7A24A;
    --gold-dim:#8C7638;
    --behind:#C1594B;
    --ahead:#6FA287;
    --hairline: rgba(239,230,210,0.14);
    --bg-a:#1F3F30;
    --bg-b:#132821;
    --over-yellow:#F2D23C;
  }
  :root[data-theme="midnight"]{
    --ink:#0F1B2D;
    --panel:#152840;
    --panel-2:#1B3352;
    --parchment:#E7ECF5;
    --parchment-dim:#9FB0C8;
    --gold:#7EA8D8;
    --gold-dim:#4C6E93;
    --behind:#D9756B;
    --ahead:#7CC4A4;
    --hairline: rgba(231,236,245,0.14);
    --bg-a:#1B3352;
    --bg-b:#0F1B2D;
  }
  :root[data-theme="sepia"]{
    --ink:#241A12;
    --panel:#33261A;
    --panel-2:#3D2D1E;
    --parchment:#F0E4D0;
    --parchment-dim:#C7B394;
    --gold:#C99A4B;
    --gold-dim:#8A6229;
    --behind:#C4695A;
    --ahead:#8AA97C;
    --hairline: rgba(240,228,208,0.14);
    --bg-a:#3D2D1E;
    --bg-b:#241A12;
  }
  :root[data-theme="ivory"]{
    --ink:#F6F1E4;
    --panel:#FFFFFF;
    --panel-2:#F2ECDB;
    --parchment:#241E12;
    --parchment-dim:#6B6252;
    --gold:#A9822E;
    --gold-dim:#8F6C24;
    --behind:#B23B2B;
    --ahead:#2E7D50;
    --hairline: rgba(36,30,18,0.12);
    --bg-a:#FBF7EC;
    --bg-b:#F0E9D6;
    --over-yellow:#B58900;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 80% -10%, var(--bg-a) 0%, var(--bg-b) 55%);
    color: var(--parchment);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding: 28px 16px 60px;
    line-height:1.6;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }

  header.top{ margin-bottom: 12px; text-align:center; }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap: 8px; flex-wrap: nowrap; }
  .header-cluster{ display:flex; align-items:baseline; gap: 6px; flex:0 1 auto; min-width:0; flex-wrap:wrap; }
  .app-logo{ width: 30px; height: 30px; object-fit: contain; flex-shrink:0; align-self:center; }
  .version-tag{ color: var(--gold); font-size: 11px; }
  h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size: 26px;
    margin: 0;
    color: var(--parchment);
    line-height:1;
  }
  .credit-line{ color: var(--parchment-dim); font-size: 10px; line-height:1.35; text-align: left; }
  .sub{ color: var(--parchment-dim); font-size: 14.5px; margin-top:6px; }

  section{
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .status-banner{
    text-align:center;
    font-size: 15.5px;
    font-weight:700;
    padding: 14px 18px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--hairline);
  }
  .status-banner.status-ahead{ color: var(--ahead); background: rgba(111,162,135,0.10); border-color: rgba(111,162,135,0.3); }
  .status-banner.status-behind{ color: var(--behind); background: rgba(193,89,75,0.10); border-color: rgba(193,89,75,0.3); }
  .status-banner.status-onpace{ color: var(--parchment); background: rgba(239,230,210,0.06); }

  .hero{
    padding: 26px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(199,162,74,0.09), transparent 60%);
    pointer-events:none;
  }
  table.metrics{
    width:100%;
    border-collapse: collapse;
    position:relative;
  }
  table.metrics th{
    text-align:center;
    font-size: 13px;
    font-weight:500;
    color: var(--parchment-dim);
    padding-bottom: 12px;
    border: none;
  }
  table.metrics th:first-child{ width: 78px; }
  table.metrics td{
    text-align:center;
    padding: 8px 4px;
    border:none;
  }
  table.metrics td.row-label{
    text-align: start;
    font-size: 13px;
    color: var(--parchment-dim);
    font-weight:500;
  }
  table.metrics .row-remaining td:not(.row-label){
    font-family:'Amiri', serif;
    font-weight:700;
    font-size: 30px;
    line-height:1;
    direction: ltr;
    color: var(--parchment);
  }
  table.metrics td .pct{
    display:block;
    font-family:'Tajawal', sans-serif;
    font-weight:500;
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 3px;
  }

  .note.center{ text-align:center; }
  .field-locked{ opacity:.4; pointer-events:none; }
  .yt-btn{ gap:5px; text-decoration:none; font-size:7.5px; font-weight:400; padding:0 14px; white-space:nowrap; line-height:1; }
  #helpBtn{ font-size:11px; font-weight:400; padding:0 8px; white-space:nowrap; line-height:1; }
  h1.top-nav{ display:flex; gap:6px; align-items:center; margin:0; }
  .header-cluster{ align-items:center; }
  .nav-btn{ display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; height:34px; }
  .nav-btn:not(.yt-btn):not(#helpBtn){ font-family:'Amiri', serif; font-size:19px; font-weight:700; line-height:1; padding:0 12px; border-radius:9px; background:transparent; color:var(--parchment-dim); border:1px solid var(--hairline); }
  #helpBtn, .yt-btn{ border-radius:9px; background:transparent; color:var(--parchment-dim); border:1px solid var(--hairline); }
  .nav-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  #app > [hidden]{ display:none !important; }
  .tuto-card{ position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:1000; width:min(460px, calc(100% - 24px)); background: color-mix(in srgb, var(--bg-b) 72%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color:var(--parchment); border:1px solid var(--hairline); border-radius:16px; padding:12px 16px 12px; box-shadow:0 10px 32px rgba(0,0,0,.45); }
  .tuto-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .tuto-kicker{ font-size:12px; color:var(--parchment-dim); }
  .tuto-mini{ display:flex; gap:6px; }
  .tuto-mini button{ padding:1px 9px; font-size:12px; border-radius:7px; }
  .tuto-card h3{ margin:0 0 6px; font-family:'Amiri', serif; font-size:21px; color:var(--gold); }
  .tuto-card p{ margin:0 0 10px; line-height:1.8; font-size:14px; max-height:32vh; overflow:auto; }
  .tuto-dots{ display:flex; gap:5px; justify-content:center; margin-bottom:10px; }
  .tuto-dots span{ width:7px; height:7px; border-radius:50%; background:var(--hairline); }
  .tuto-dots span.on{ background:var(--gold); }
  .tuto-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .dlg-backdrop{ position:fixed; inset:0; z-index:1100; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; padding:16px; }
  .dlg-backdrop .tuto-card{ position:relative; left:auto; bottom:auto; transform:none; width:min(440px, 100%); }
  .dlg-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .tuto-chip{ position:fixed; bottom:12px; right:12px; z-index:1000; padding:6px 12px; border-radius:999px; font-size:13px; background: color-mix(in srgb, var(--bg-b) 80%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border:1px solid var(--gold); color:var(--parchment); }
  .tuto-arrow{ position:fixed; z-index:1001; pointer-events:none; display:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); animation: tutoBounce .9s ease-in-out infinite; }
  @keyframes tutoBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(7px); } }
  .perm-dim{ opacity:.3; filter:grayscale(1); pointer-events:none; user-select:none; }
  .perm-banner{ position:sticky; top:8px; z-index:5; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  table.khatma-list{ font-size:12px; }
  table.khatma-list th{ padding:0 3px 6px; font-size:11.5px; white-space:nowrap; }
  table.khatma-list td{ padding:5px 3px; white-space:nowrap; line-height:1.3; }
  table.khatma-list .date-text{ display:inline; padding:0; font-size:12px; }
  table.khatma-list .sub-date{ display:inline; font-size:11px; }
  table.khatma-list .tag{ font-size:11px; padding:1px 7px; }
  table.khatma-list button.ghost{ padding:2px 6px; font-size:12px; border-radius:6px; margin:0; }
  .old-round .date-text{ display:inline; padding:0; font-size:12.5px; }
  .khatma-group-row td{ padding-top:14px; font-size:15px; border-bottom:1px solid var(--hairline); }
  .old-round{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--parchment-dim); }
  .old-round button{ padding:2px 10px; font-size:14px; }
  .ledger-table tr.over-quota td{ color: var(--over-yellow); }
  .ledger-table tr.under-quota td{ color: var(--behind); }

  .bars{ margin-top: 24px; text-align: start; }
  .bar-row{ margin-bottom: 12px; }
  .bar-row .bar-label{
    display:flex; justify-content:space-between;
    font-size: 12.5px; color: var(--parchment-dim); margin-bottom: 5px;
  }
  .bar-track{
    height: 8px; border-radius: 5px;
    background: rgba(239,230,210,0.10);
    overflow:hidden;
  }
  .bar-fill{ height:100%; border-radius:5px; transition: width .5s ease; }
  .bar-fill.time{ background: var(--parchment-dim); }
  .bar-fill.time.overdue{ background: var(--behind); }
  .bar-fill.progress{ background: var(--gold); }

  h2{
    font-family:'Amiri', serif;
    font-size: 20px;
    margin: 0 0 16px;
    color: var(--parchment);
    font-weight:700;
  }
  label{
    display:block;
    font-size: 13px;
    color: var(--parchment-dim);
    margin-bottom: 6px;
  }
  .row{ display:flex; gap: 12px; margin-bottom: 14px; }
  .row.date-row{ gap: 4px; margin-bottom: 6px; flex-wrap: nowrap; }
  .row.date-row .field{ text-align: center; min-width: 0; }
  .row.date-row .field label{ display:block; text-align:center; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.date-row .field input{ text-align: center; padding-left: 4px; padding-right: 4px; }
  .date-row-with-title{ align-items: flex-end; }
  .date-row-with-title .inline-title{ margin:0 0 6px; flex: 0 0 auto; white-space: nowrap; }
  .date-row-with-title .field{ flex: 1 1 0; }
  .date-hint{ font-size: 10.5px; color: var(--parchment-dim); margin-top: 3px; text-align: center; }
  .hijri-single{ width: 100%; text-align: center; direction: ltr; }
  .field{ flex:1; min-width:0; }
  .hero-row{ align-items: flex-end; flex-wrap: wrap; }
  .hero-row .field-ayah{ flex: 0 0 78px; }
  .hero-row .field-date{ flex: 0 0 152px; }
  .hero-row .field-btn{ flex: 0 0 auto; }
  .hero-row .field-btn button{ white-space:nowrap; }
  select, input[type="number"], input[type="text"], input[type="date"], input[type="url"]{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--hairline);
    color: var(--parchment);
    padding: 10px 12px;
    border-radius: 8px;
    font-family:'Tajawal', sans-serif;
    font-size: 15px;
  }
  select:focus, input:focus{ outline: 2px solid var(--gold-dim); outline-offset: 1px; }
  input:disabled{ opacity: 0.55; cursor: not-allowed; }

  button{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size: 15px;
    padding: 11px 20px;
    border-radius: 9px;
    border: none;
    cursor:pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  button.primary{ background: var(--gold); color: var(--ink); }
  button.primary:hover{ filter: brightness(1.08); }
  button.ghost{
    background: transparent;
    color: var(--parchment-dim);
    border: 1px solid var(--hairline);
  }
  button.ghost:hover{ color: var(--parchment); border-color: var(--gold-dim); }
  button:active{ transform: scale(0.98); }
  button:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .actions{ display:flex; gap: 10px; flex-wrap:wrap; }

  .section-divider{
    border-top: 1px dashed var(--hairline);
    margin: 20px 0;
  }
  .overdue-count{ color: var(--behind); font-weight:700; }
  .overdue-note{ color: var(--behind); font-weight:700; font-size: 12.5px; }
  .ahead-note{ color: var(--ahead); font-weight:700; font-size: 12.5px; }

  .new-khatma-form{
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--hairline);
  }

  .ledger-empty{
    color: var(--parchment-dim);
    font-size: 14px;
    text-align:center;
    padding: 10px 0;
  }
  table{ width:100%; border-collapse: collapse; font-size: 14px; }
  th{
    text-align: start;
    color: var(--parchment-dim);
    font-weight:500;
    font-size: 12.5px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
  }
  td{
    padding: 10px 0;
    border-bottom: 1px solid var(--hairline);
  }
  tr:last-child td{ border-bottom:none; }

  .table-scroll{ overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.ledger-table{ font-size: 12.5px; white-space: nowrap; }
  table.ledger-table th, table.ledger-table td{ text-align: center; }
  table.ledger-table th:first-child, table.ledger-table td:first-child{ text-align: right; }
  table.ledger-table th{ padding: 0 6px 6px 0; }
  table.ledger-table td{ padding: 6px 4px 6px 0; line-height:1.35; }
  table.ledger-table th:last-child, table.ledger-table td:last-child{ padding-inline-end: 0; }
  table.ledger-table td[rowspan]{ vertical-align: middle; border-inline-end: 1px dashed var(--hairline); white-space: nowrap; min-width: 84px; padding-inline-end: 6px; }
  table.ledger-table td[rowspan] .sub-date{ white-space: nowrap; }
  table.ledger-table .hizb-col{ padding-inline-start: 3px; padding-inline-end: 3px; }
  table.ledger-table th small{ font-size: 10px; font-weight: 400; opacity: .8; }
  table.ledger-table .time-col{ width: 1%; white-space: nowrap; padding-inline-end: 3px; padding-inline-start: 3px; direction: ltr; text-align: center; color: var(--parchment-dim); }
  .entry-time{ display:block; font-size: 10.5px; color: var(--parchment-dim); direction: ltr; }
  .entry-time-inline{ font-size: 10.5px; color: var(--parchment-dim); direction: ltr; }
  .time-list{ margin-top: 4px; }
  .time-list .entry-time{ margin-top: 2px; }
  .sub-date{ display:block; font-size: 10.5px; color: var(--parchment-dim); font-weight:400; }

  .khatma-view-picker{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .khatma-view-picker .k{ color: var(--parchment-dim); font-size: 13px; }
  .khatma-view-picker select{ width:auto; max-width: 100%; }

  .tag{
    display:inline-block;
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .tag.ahead{ background: rgba(111,162,135,0.18); color: var(--ahead); }
  .tag.behind{ background: rgba(193,89,75,0.18); color: var(--behind); }
  .tag.onpace{ background: rgba(239,230,210,0.10); color: var(--parchment-dim); }
  .tag.done{ background: rgba(199,162,74,0.18); color: var(--gold); }
  .tag.pending{ background: rgba(239,230,210,0.10); color: var(--parchment-dim); }
  .edit-khatma-btn, .relance-khatma-btn, .cancel-khatma-btn, .resume-khatma-btn, .archive-khatma-btn, .delete-khatma-btn, .unarchive-khatma-btn{ padding: 4px 8px; font-size: 13px; line-height:1; margin-inline-start: 4px; }
  tr.archived-row{ opacity: 0.6; }
  tr.khatma-edit-row td{ padding-top: 10px; padding-bottom: 10px; }

  section.settings{ padding: 12px 16px; margin-bottom: 12px; }
  section.settings h2{ display:none; }
  .settings-row{ display:flex; gap: 10px; }
  .settings-field{ flex:1; min-width:0; }
  .settings-field .k{ display:block; color: var(--parchment-dim); font-size: 11.5px; margin-bottom: 4px; }
  .settings-field select{ padding: 7px 9px; font-size: 13.5px; }

  .filelink-status{
    font-size: 13px; color: var(--parchment-dim);
    padding: 10px 0;
  }
  .filelink-status.ok{ color: var(--ahead); }
  .filelink-status.warn{ color: var(--behind); }

  .backup-section{ padding: 18px; }
  [hidden]{ display:none !important; }
  /* تصغير المسافات العمودية */
  body{ padding: 12px 12px 24px; }
  header.top{ margin-bottom: 8px; }
  .sub{ margin-top: 0; }
  .sub:empty{ display:none; }
  section{ padding: 14px 16px; margin-bottom: 10px; }
  section.hero{ padding: 14px 16px 12px; }
  section.settings{ padding: 10px 14px; margin-bottom: 10px; }
  .backup-section{ padding: 12px 14px; }
  .backup-section h2{ margin-bottom: 6px; font-size: 17px; }
  .backup-section .filelink-status{ padding: 4px 0; }
  h2{ margin-bottom: 10px; }
  .hero h2{ font-size: 17px; margin: 0; white-space: nowrap; }
  .hero-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap: wrap; }
  .hero-khatma-select{ flex: 0 0 auto; width:auto; max-width: 100%; font-size: 12px; padding: 5px 6px; }
  .hero-status{ flex:1 1 0; min-width:0; font-size:11px; line-height:1.35; text-align:start; }
  .hero-status .overdue-note, .hero-status .ahead-note{ font-size:11px; }
  .hero-rate{ color: var(--parchment-dim); }
  .hero .row{ margin-bottom: 6px; }
  .hero .section-divider{ margin: 8px 0; }
  .hero .date-row-with-title .inline-title{ font-size: 16px; margin-bottom: 8px; }
  .date-text{ display:block; padding: 9px 2px; font-size: 14px; text-align:center; direction:ltr; color: var(--parchment); white-space:nowrap; }
  .hero .new-khatma-form{ margin-top: 4px; padding-top: 8px; }
  .hero .new-khatma-form .actions button{ padding: 6px 12px; font-size: 13px; }
  .khatma-line{ display:flex; align-items:flex-end; justify-content:center; gap:10px; flex-wrap:nowrap; }
  .khatma-line .mf{ flex:0 0 auto; text-align:center; }
  .khatma-line .mf label{ font-size:10px; margin:0 0 2px; white-space:nowrap; text-align:center; }
  .khatma-line h2{ padding-bottom:4px; }
  .khatma-line h2{ margin:0; font-size:16px; white-space:nowrap; flex:0 0 auto; }
  .khatma-line .date-text{ padding:4px 0; font-size:12.5px; }
  .khatma-line input.days-mini{ width:46px; flex:0 0 46px; padding:4px 2px; font-size:13px; text-align:center; }
  .hero .actions.mini{ margin-top:6px; justify-content:center; }
  .hero .actions.mini button{ padding:4px 10px; font-size:12.5px; }
  .khatma-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom: 4px; }
  .khatma-head h2{ margin:0; font-size:16px; }
  .khatma-head button{ padding: 4px 10px; font-size: 12.5px; }
  .hero .row.date-row{ align-items:flex-end; }
  .backup-section button{ padding: 8px 14px; font-size: 14px; }
  .backup-section .actions{ gap: 8px; }
  .hero .new-khatma-form .row{ margin-bottom: 8px; }
  .view-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; margin-bottom:10px; padding:8px 16px;
    background: var(--panel); color: var(--parchment);
    border:1px solid var(--hairline); border-radius:14px;
    font-family:'Amiri', serif; font-size:16px; font-weight:700;
  }
  .view-toggle:hover{ border-color: var(--gold-dim); }
  .view-toggle .chev{ display:inline-block; color: var(--gold); font-size:14px; transition: transform .2s ease; }
  .view-toggle[aria-expanded="true"] .chev{ transform: rotate(180deg); }

  .note{ font-size:12.5px; color: var(--parchment-dim); margin-top:10px; }

  .completed-badge{
    display:inline-flex; align-items:center; gap:6px;
    background: rgba(199,162,74,0.12);
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    margin-top: 8px;
  }

  .stats-summary{
    display:flex; gap: 18px; flex-wrap:wrap;
    margin-bottom: 14px;
  }

function unitPosition(boundaries, p){
  const n = boundaries.length - 1;
  if(p <= boundaries[0]) return 0;
  if(p >= boundaries[n]) return n;
  for(let i=0;i<n;i++){
    if(p >= boundaries[i] && p < boundaries[i+1]){
      return i + (p - boundaries[i])/(boundaries[i+1]-boundaries[i]);
    }
  }
  return n;
}

// يمنع تسجيل موضع يتراجع بالنسبة لتاريخ سابق، أو يتجاوز موضعًا مسجَّلًا لاحقًا.
function entryDateTime(e){ return e.date + 'T' + (e.time || '00:00'); }

// يحذف التكرارات المطابقة تمامًا فقط (نفس التاريخ والوقت والسورة والآية). يُسمح بعدة تسجيلات في اليوم الواحد.
function dedupeEntries(khatma){
  const seen = new Set();
  const kept = [];
  for(const e of khatma.entries){
    const key = e.date + '|' + (e.time || '') + '|' + e.surahIdx + '|' + e.ayah;
    if(seen.has(key)) continue;
    seen.add(key);
    kept.push(e);
  }
  if(kept.length === khatma.entries.length) return false;
  khatma.entries = kept.sort((a,b)=> entryDateTime(a).localeCompare(entryDateTime(b)));
  return true;
}

function validateEntryOrder(khatma, date, time, cumulative){
  const newDT = date + 'T' + time;
  let prev = null, next = null;
  for(const e of khatma.entries){
    const dt = entryDateTime(e);
    if(dt < newDT && (!prev || dt > entryDateTime(prev))) prev = e;
    if(dt > newDT && (!next || dt < entryDateTime(next))) next = e;
  }
  if(prev && cumulative < prev.cumulative){
    return { ok:false, message: 'هذا الموضع (' + nd(cumulative) + ' آية) أقل مما سجّلته بتاريخ ' + dateDisplayInline(prev.date) + ' (' + nd(prev.cumulative) + ' آية). لا يمكن أن يتراجع الموضع مع مرور الوقت — تحقّق من التاريخ أو من الموضع الذي أدخلته.' };
  }
  if(next && cumulative > next.cumulative){
    return { ok:false, message: 'هذا الموضع (' + nd(cumulative) + ' آية) أكبر مما سجّلته لاحقًا بتاريخ ' + dateDisplayInline(next.date) + ' (' + nd(next.cumulative) + ' آية). تحقّق من التاريخ أو من الموضع الذي أدخلته.' };
  }
  return { ok:true };
}

function toHijriStr(iso){
  try{
    const d = new Date(iso+'T00:00:00');
    const formatter = new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura-nu-latn', { day:'numeric', month:'long', year:'numeric' });
    return formatter.format(d); // يتضمّن "هـ" تلقائيًا في نهاية النص
  }catch(e){ return iso; }
}

// صيغة هجرية رقمية مختصرة (DD/MM/YYYY) خاصة بعمود التاريخ في السجل.
function toHijriNumericStr(iso){
  try{
    const d = new Date(iso+'T00:00:00');
    const formatter = new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura-nu-latn', { day:'2-digit', month:'2-digit', year:'numeric' });
    const parts = formatter.formatToParts(d);
    const get = t => (parts.find(p=>p.type===t) || {}).value || '';
    return get('year') + '/' + get('month') + '/' + get('day');
  }catch(e){ return iso; }

const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

// روايات القراءات العشر الأربعين المشهورة (عشرون رواية).
const RIWAYAT_LIST = [
  'حفص عن عاصم','شعبة عن عاصم',
  'ورش عن نافع','قالون عن نافع',
  'الدوري عن أبي عمرو','السوسي عن أبي عمرو',
  'البزي عن ابن كثير','قنبل عن ابن كثير',
  'هشام عن ابن عامر','ابن ذكوان عن ابن عامر',
  'خلف عن حمزة','خلاد عن حمزة',
  'إدريس عن خلف العاشر','إسحاق عن خلف العاشر',
  'روح عن يعقوب','رويس عن يعقوب',
  'ابن وردان عن أبي جعفر','ابن جماز عن أبي جعفر'
];
function riwayaSelectHtml(id, current){
  const opts = RIWAYAT_LIST.map(r => `<option value="${escHtml(r)}" ${r===current?'selected':''}>${escHtml(r)}</option>`).join('');
  const customOpt = (current && !RIWAYAT_LIST.includes(current)) ? `<option value="${escHtml(current)}" selected>${escHtml(current)}</option>` : '';
  const emptyOpt = `<option value="" ${!current?'selected':''}>—</option>`;
  return `<select id="${id}">${emptyOpt}${customOpt}${opts}</select>`;
}

// يُرجع يوم/شهر/سنة هجرية كأرقام صحيحة لتاريخ ميلادي (ISO) معيّن.
function toHijriPartsNum(iso){
  try{
    const d = new Date(iso+'T00:00:00');
    const formatter = new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura-nu-latn', { day:'numeric', month:'numeric', year:'numeric' });
    const parts = formatter.formatToParts(d);
    const get = t => parseInt((parts.find(p=>p.type===t) || {}).value || '0', 10);
    return { day:get('day'), month:get('month'), year:get('year') };
  }catch(e){ return { day:1, month:1, year:1447 }; }
}

// يحوّل يوم/شهر/سنة هجرية إلى تاريخ ميلادي (ISO): تقدير أولي بمتوسط طول السنة/الشهر الهجري
// انطلاقًا من مكافئ اليوم الحالي، ثم تدقيق بالبحث ضمن نافذة صغيرة تحقّقًا من تقويم المتصفح الفعلي.
function hijriToIso(hy, hm, hd){
  const todayIso = todayStr();
  const t = toHijriPartsNum(todayIso);
  const deltaDays = Math.round((hy - t.year)*354.36707 + (hm - t.month)*29.53059 + (hd - t.day));
  const base = new Date(todayIso+'T00:00:00');
  base.setDate(base.getDate() + deltaDays);
  const isoOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  for(let delta=-25; delta<=25; delta++){
    const d = new Date(base.getTime());
    d.setDate(d.getDate() + delta);
    const iso = isoOf(d);
    const p = toHijriPartsNum(iso);
    if(p.day===hd && p.month===hm && p.year===hy) return iso;
  }
  return isoOf(base);
}

// صيغة هجرية معكوسة (يوم/شهر/سنة) لعرض حقول الاختيار — توافق اتجاه القراءة المعتاد للتاريخ بالعربية.
function toHijriNumericStrRev(iso){
  try{
    const d = new Date(iso+'T00:00:00');
    const formatter = new Intl.DateTimeFormat('ar-u-ca-islamic-umalqura-nu-latn', { day:'2-digit', month:'2-digit', year:'numeric' });
    const parts = formatter.formatToParts(d);
    const get = t => (parts.find(p=>p.type===t) || {}).value || '';
    return get('day') + '/' + get('month') + '/' + get('year');
  }catch(e){ return iso; }
}
// عدد أيام شهر هجري مُعيّن (29 أو 30)، محسوبًا بالتحقق الفعلي من تقويم المتصفح.
function hijriMonthLength(year, month){
  for(let day=30; day>=29; day--){
    const iso = hijriToIso(year, month, day);
    const p = toHijriPartsNum(iso);
    if(p.year===year && p.month===month && p.day===day) return day;
  }
  return 29;
}

// ---- التقويم الهجري المنبثق: يُنشأ مرة واحدة في body ويُعاد استخدامه لكل الحقول ----
let hijriCalState = null; // { idPrefix, minIso, maxIso, viewYear, viewMonth, selectedIso }

function ensureHijriCalendarDom(){
  let overlay = document.getElementById('hijriCalOverlay');
  if(overlay) return overlay;
  overlay = document.createElement('div');
  overlay.className = 'hijri-cal-overlay';
  overlay.id = 'hijriCalOverlay';
  overlay.innerHTML = `
    <div class="hijri-cal-popup" role="dialog" aria-modal="true" aria-label="اختيار تاريخ هجري">
      <div class="hijri-cal-header">
        <button type="button" class="hijri-cal-nav" id="hijriCalPrev" aria-label="الشهر السابق">‹</button>
        <span class="hijri-cal-title" id="hijriCalTitle"></span>
        <button type="button" class="hijri-cal-nav" id="hijriCalNext" aria-label="الشهر التالي">›</button>
      </div>
      <div class="hijri-cal-weekdays">
        <span>ح</span><span>ن</span><span>ث</span><span>ر</span><span>خ</span><span>ج</span><span>س</span>
      </div>
      <div class="hijri-cal-grid" id="hijriCalGrid"></div>
      <div class="hijri-cal-footer">
        <button type="button" class="ghost" id="hijriCalClose">إغلاق</button>
        <button type="button" class="primary" id="hijriCalToday">اليوم</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeHijriCalendar(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && hijriCalState) closeHijriCalendar(); });
  document.getElementById('hijriCalPrev').addEventListener('click', ()=>{
    if(!hijriCalState) return;
    hijriCalState.viewMonth--;
    if(hijriCalState.viewMonth < 1){ hijriCalState.viewMonth = 12; hijriCalState.viewYear--; }
    renderHijriCalendarBody();
  });
  document.getElementById('hijriCalNext').addEventListener('click', ()=>{
    if(!hijriCalState) return;
    hijriCalState.viewMonth++;
    if(hijriCalState.viewMonth > 12){ hijriCalState.viewMonth = 1; hijriCalState.viewYear++; }
    renderHijriCalendarBody();
  });
  document.getElementById('hijriCalClose').addEventListener('click', closeHijriCalendar);
  document.getElementById('hijriCalToday').addEventListener('click', ()=>{
    if(!hijriCalState) return;
    const t = todayStr();
    const within = (!hijriCalState.minIso || t >= hijriCalState.minIso) && (!hijriCalState.maxIso || t <= hijriCalState.maxIso);
    const tp = toHijriPartsNum(t);
    hijriCalState.viewYear = tp.year; hijriCalState.viewMonth = tp.month;
    if(within){ selectHijriDay(t); } else { renderHijriCalendarBody(); }
  });
  document.getElementById('hijriCalGrid').addEventListener('click', (e)=>{
    const btn = e.target.closest('.hijri-cal-day');
    if(!btn || btn.disabled || !btn.dataset.iso) return;
    selectHijriDay(btn.dataset.iso);
  });
  return overlay;
}

function renderHijriCalendarBody(){
  const st = hijriCalState;
  if(!st) return;
  document.getElementById('hijriCalTitle').textContent = HIJRI_MONTHS[st.viewMonth-1] + ' ' + nd(st.viewYear);
  const len = hijriMonthLength(st.viewYear, st.viewMonth);
  const firstIso = hijriToIso(st.viewYear, st.viewMonth, 1);
  const firstWeekday = new Date(firstIso+'T00:00:00').getDay();
  const today = todayStr();
  let html = '';
  for(let i=0; i<firstWeekday; i++){ html += `<span class="hijri-cal-day empty"></span>`; }
  for(let day=1; day<=len; day++){
    const iso = hijriToIso(st.viewYear, st.viewMonth, day);
    const disabled = (st.minIso && iso < st.minIso) || (st.maxIso && iso > st.maxIso);
    const cls = ['hijri-cal-day'];
    if(iso === today) cls.push('today');
    if(iso === st.selectedIso) cls.push('selected');
    html += `<button type="button" class="${cls.join(' ')}" data-iso="${iso}" ${disabled ? 'disabled' : ''}>${nd(day)}</button>`;
  }
  document.getElementById('hijriCalGrid').innerHTML = html;
}

function openHijriCalendar(idPrefix, iso, minIso, maxIso){
  ensureHijriCalendarDom();
  const startIso = iso || todayStr();
  const parts = toHijriPartsNum(startIso);
  hijriCalState = { idPrefix, minIso: minIso || null, maxIso: maxIso || null, viewYear: parts.year, viewMonth: parts.month, selectedIso: startIso };
  renderHijriCalendarBody();
  document.getElementById('hijriCalOverlay').classList.add('open');
}

function closeHijriCalendar(){
  const overlay = document.getElementById('hijriCalOverlay');
  if(overlay) overlay.classList.remove('open');
  hijriCalState = null;
}

function selectHijriDay(iso){
  if(!hijriCalState) return;
  const input = document.getElementById(hijriCalState.idPrefix + 'Hijri');
  if(input){
    input.value = nd(toHijriNumericStrRev(iso));
    input.dataset.iso = iso;
  }
  closeHijriCalendar();
  if(input) input.dispatchEvent(new Event('change', { bubbles:true }));
}

// صيغة ميلادية رقمية مختصرة (DD/MM/YYYY) خاصة بعمود التاريخ في السجل.
function toGregNumericStr(iso){
  const parts = iso.split('-');
  if(parts.length !== 3) return iso;
  const [y,m,d] = parts;
  return y + '/' + m + '/' + d;
}

// يبني عرضًا للتاريخ حسب التقويم المفضّل (كبير) مع التقويم الآخر أسفله بخط أصغر — يُستخدم خارج جدول السجل.
function dateDisplayHtml(iso){

  const greg = nd(iso);
  if(state.calendarPref === 'gregorian'){
    return `<span title="${hijri}">${greg}</span>`;
  }
  return `<span title="${greg}">${hijri}</span>`;
}
function dateDisplayInline(iso){
  const hijri = nd(toHijriStr(iso));
  const greg = nd(iso);
  return state.calendarPref === 'gregorian' ? `${greg} (${hijri})` : `${hijri} (${greg})`;
}
// عرض مختصر رقميًا لعمود التاريخ في جدول سجل الختمة تحديدًا (هجري: سنة/شهر/يوم، ميلادي: يوم/شهر/سنة)، مع احترام التقويم المفضّل.
function dateDisplayLedger(iso){
  const hijriNum = nd(toHijriNumericStr(iso));
  const gregNum = nd(toGregNumericStr(iso));
  if(state.calendarPref === 'gregorian'){
    return `<span title="${nd(toHijriStr(iso))}">${gregNum}</span>`;
  }
  return `<span title="${nd(iso)}">${hijriNum}</span>`;

// نص تاريخ مضغوط (غير قابل للتعديل) حسب التقويم المفضّل: هجري يوم/شهر/سنة، ميلادي يوم/شهر/سنة، والآخر في tooltip.
function dateTextCompact(iso){
  const g = iso.split('-');
  const gregRev = g.length === 3 ? g[2] + '/' + g[1] + '/' + g[0] : iso;
  const hijriRev = toHijriNumericStrRev(iso);
  if(state.calendarPref === 'gregorian') return `<span class="date-text" title="${nd(hijriRev)}">${nd(gregRev)}</span>`;
  return `<span class="date-text" title="${nd(gregRev)}">${nd(hijriRev)}</span>`;
}

const FS_DB_NAME = 'khatm-fs-handles';
const FS_STORE = 'handles';
const FS_HANDLE_KEY = 'khatm-dir';
const FS_FILE_HANDLE_KEY = 'khatm-file';
const FS_FILE_NAME = 'khatm-data.json';

let dirHandle = null;
let fileHandle = null;
let linkMode = null; // 'file' | 'folder' | null
let fileSyncInfo = null; // { ok, time } — حالة آخر حفظ في ملف JSON المرتبط
function syncTimeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
// 'unsupported' | 'not-linked' | 'needs-permission' | 'linked'
let fileLinkStatus = 'unsupported';

function supportsFileSystemAccess(){
  return typeof window.showDirectoryPicker === 'function';
}
function supportsFilePicker(){
  return typeof window.showOpenFilePicker === 'function';
}

function openHandleDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(FS_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_STORE,'readonly');
      const req = tx.objectStore(FS_STORE).get(key);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbSet(key,val){
  try{
    const db = await openHandleDB();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).put(val,key);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ /* ignore */ }
}
async function idbDelete(key){
  try{
    const db = await openHandleDB();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).delete(key);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){ /* ignore */ }
}

// يتحقق تلقائيًا: هل ملف khatm-data.json موجود في المجلد المرتبط؟ إن لا، يُنشئه فورًا — دون أي طلب إضافي.
async function resolveFileInDir(){
  try{
    fileHandle = await dirHandle.getFileHandle(FS_FILE_NAME, { create:false });
    await loadFromFileHandle();
  }catch(e){
    fileHandle = await dirHandle.getFileHandle(FS_FILE_NAME, { create:true });
    await writeToFileHandle();
  }
}

// ---- Google Identity Services + Drive API: بديل سحابي حقيقي لصفحة ثابتة بلا خادم ----
// يجب استبدال القيمة التالية بمعرّف عميل OAuth خاص بك من Google Cloud Console
// (فعّل Google Drive API، أنشئ "OAuth client ID" من نوع Web application، وأضف نطاق موقعك
// -مثل https://smartlamine-alt.github.io- إلى "Authorized JavaScript origins").
const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
const DRIVE_FILE_NAME = 'khatm-data.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file'; // نطاق محدود بالملفات التي ينشئها التطبيق نفسه فقط

let googleTokenClient = null;
let googleAccessToken = null;
let driveFileId = null;
// 'unavailable' | 'not-signed-in' | 'signed-in' | 'linked'
let driveStatus = 'unavailable';

function googleConfigured(){
  return typeof GOOGLE_CLIENT_ID === 'string' && GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID') !== 0;
}

function initGoogleAuthIfAvailable(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2 || !googleConfigured()){
    driveStatus = 'unavailable';
    return;
  }
  try{
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp)=>{
        if(resp && resp.access_token){
          googleAccessToken = resp.access_token;
          await afterGoogleSignIn();
        }
      }
    });
    driveStatus = 'not-signed-in';
    googleTokenClient.requestAccessToken({ prompt: '' });
  }catch(e){
    driveStatus = 'unavailable';
  }
}

function signInWithGoogle(){
  if(!googleTokenClient) return;
  googleTokenClient.requestAccessToken({ prompt: 'consent' });
}

function signOutGoogle(){
  if(googleAccessToken && typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(googleAccessToken, ()=>{}); }catch(e){}
  }
  googleAccessToken = null;
  driveFileId = null;
  driveStatus = googleConfigured() ? 'not-signed-in' : 'unavailable';
  render();
}

async function driveApiFetch(url, options={}){
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), 'Authorization': 'Bearer ' + googleAccessToken }
  });
  if(!res.ok) throw new Error('Drive API error: ' + res.status);
  return res;
}

async function afterGoogleSignIn(){
  driveStatus = 'signed-in';
  try{
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const listRes = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
    const listData = await listRes.json();
    if(listData.files && listData.files.length){
      driveFileId = listData.files[0].id;
      await driveLoad();
    } else {
      const createRes = await driveApiFetch('https://www.googleapis.com/drive/v3/files', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType:'application/json' })
      });
      const created = await createRes.json();
      driveFileId = created.id;
      await driveSave();
    }
    driveStatus = 'linked';
  }catch(e){
    console.error('تعذر الاتصال بـ Google Drive', e);
    driveStatus = 'signed-in';
  }
  render();
}

async function driveLoad(){
  if(!driveFileId) return;
  try{
    const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
    const text = await res.text();
    if(text && text.trim()){
      const migrated = migrateIfNeeded(JSON.parse(text));
      if(migrated){ state = migrated; }
    }
  }catch(e){ console.error('تعذرت قراءة ملف Drive', e); }
}

async function driveSave(){
  if(!driveFileId || versionWarning) return;
  try{
    await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
  }catch(e){ console.error('تعذر الحفظ في Drive', e); }
}

async function initFileLink(){
  if(!supportsFileSystemAccess() && !supportsFilePicker()){ fileLinkStatus = 'unsupported'; return; }

  // أولوية لملف مرتبط مباشرة (تم اختياره بعينه) على ربط مجلد كامل.
  const savedFile = await idbGet(FS_FILE_HANDLE_KEY);
  if(savedFile){
    fileHandle = savedFile;
    linkMode = 'file';
    try{
      const perm = await fileHandle.queryPermission({ mode:'readwrite' });
      if(perm === 'granted'){
        await loadFromFileHandle();
        if(versionWarning) return;
        fileLinkStatus = 'linked';
      } else {
        fileLinkStatus = 'needs-permission';
      }
    }catch(e){
      fileLinkStatus = 'not-linked';
      linkMode = null;
    }
    return;
  }

  const savedDir = await idbGet(FS_HANDLE_KEY);
  if(!savedDir){ fileLinkStatus = supportsFileSystemAccess() || supportsFilePicker() ? 'not-linked' : 'unsupported'; return; }
  dirHandle = savedDir;
  linkMode = 'folder';
  try{
    const perm = await dirHandle.queryPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      await resolveFileInDir();
      if(versionWarning) return;
      fileLinkStatus = 'linked';
    } else {
      fileLinkStatus = 'needs-permission';
    }
  }catch(e){
    fileLinkStatus = 'not-linked';
    linkMode = null;
  }
}

async function loadFromFileHandle(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      const migrated = migrateIfNeeded(JSON.parse(text));
      if(migrated){ state = migrated; fileSyncInfo = { ok:true, time: syncTimeStr() }; }
      // إن كان الملف بإصدار أحدث (versionWarning مُفعَّل)، لا نلمس state ولا نكتب فوقه.
    } else {
      await writeToFileHandle();
    }
  }catch(e){ console.error('تعذرت قراءة الملف المرتبط', e); }
}

async function writeToFileHandle(){
  if(!fileHandle || versionWarning) return;
  try{
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    fileSyncInfo = { ok:true, time: syncTimeStr() };
  }catch(e){ fileSyncInfo = { ok:false, time: syncTimeStr() }; console.error('تعذر الحفظ في الملف المرتبط', e); }
}

// نقرة واحدة فقط: اختيار مجلد، ثم كل شيء بعدها تلقائي (تحقق من الملف/إنشاؤه/تحميله/تحديثه) دون أي طلب إضافي.
async function linkFolder(){
  try{
    const handle = await window.showDirectoryPicker();
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm !== 'granted') return;
    dirHandle = handle;
    linkMode = 'folder';
    await idbDelete(FS_FILE_HANDLE_KEY); // وضع المجلد يُلغي أي ربط ملف مباشر سابق
    await idbSet(FS_HANDLE_KEY, handle);
    fileLinkStatus = 'linked';
    await resolveFileInDir();
    await saveState();
    render();
  }catch(e){ /* ألغى المستخدم الاختيار */ }
}

// اختيار ملف JSON موجود بعينه (مثلًا نسخة صدّرتها سابقًا) وربطه للحفظ التلقائي فيه مباشرة.
async function linkExistingFile(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
      excludeAcceptAllOption: false
    });
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm !== 'granted') return;
    fileHandle = handle;
    dirHandle = null;
    linkMode = 'file';
    await idbDelete(FS_HANDLE_KEY); // وضع الملف المباشر يُلغي أي ربط مجلد سابق
    await idbSet(FS_FILE_HANDLE_KEY, handle);
    fileLinkStatus = 'linked';
    await loadFromFileHandle();
    await saveState();
    render();
  }catch(e){ /* ألغى المستخدم الاختيار */ }
}

async function grantPermissionAgain(){
  const handle = linkMode === 'file' ? fileHandle : dirHandle;
  if(!handle) return;
  try{
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileLinkStatus = 'linked';
      if(linkMode === 'file'){ await loadFromFileHandle(); }
      else { await resolveFileInDir(); }
      await saveState();
      render();
    }
  }catch(e){ /* ignore */ }
}

async function unlinkFile(){
  dirHandle = null;
  fileHandle = null;
  linkMode = null;
  fileLinkStatus = (supportsFileSystemAccess() || supportsFilePicker()) ? 'not-linked' : 'unsupported';
  await idbDelete(FS_HANDLE_KEY);
  await idbDelete(FS_FILE_HANDLE_KEY);
  render();
}

const APP_DATA_VERSION = 2; // كل تغيير في بنية البيانات يرفع هذا الرقم، مع خطوة ترقية أدناه.
const APP_VERSION = '2.45'; // رقم إصدار التطبيق نفسه (الميزات/الواجهة)، يرتفع مع كل تحديث — راجع سجل التغييرات.
let versionWarning = null; // { fileVersion } عند العثور على ملف بإصدار أحدث مما يدعمه هذا HTML

function migrateIfNeeded(raw){
  if(!raw) return null;

  let v;
  if(typeof raw.version === 'number'){ v = raw.version; }
  else if(Array.isArray(raw.khatmas)){ v = 2; }
  else if(raw.startDate && Array.isArray(raw.entries)){ v = 1; }
  else { return null; }

  if(v > APP_DATA_VERSION){
    // الملف محفوظ بإصدار بيانات أحدث من الذي يدعمه ملف HTML هذا — لا نلمسه لتفادي فقدان بيانات.
    versionWarning = { fileVersion: v };
    return null;
  }
  versionWarning = null;

  let data = raw;
  if(v === 1){
    // Old single-cycle format -> wrap into khatmas array.
    data = {
      numeralSystem: raw.numeralSystem || 'western',
      theme: raw.theme || 'emerald',
      legacyCompletedCount: raw.completedCount || 0,
      khatmas: [{
        startDate: raw.startDate,
        durationDays: raw.durationDays || 15,
        entries: raw.entries || []
      }]
    };
  }
  data.version = APP_DATA_VERSION;
  return data;
}

// يضيف حقل الحالة الافتراضي (جارية/مكتملة) للختمات القديمة التي لا تملكه؛ لا يضع "ملغاة" تلقائيًا أبدًا.
function backfillKhatmaStatus(){
  let changed = false;
  for(const k of state.khatmas){
    if(!k.status){
      k.status = completedDaysTaken(k) !== null ? 'completed' : 'ongoing';
      changed = true;
    }
    if(k.archived === undefined){
      k.archived = false;
      changed = true;
    }
  }
  return changed;
}

// يشغّل حذف التكرارات على كل الختمات المخزَّنة؛ يُعيد true إن حدث أي تغيير.
function dedupeAllKhatmas(){
  let anyChanged = false;
  for(const k of state.khatmas){
    if(dedupeEntries(k)) anyChanged = true;
  }
  return anyChanged;
}

// ---- التحقق من وجود تحديث ----
// ضع هنا رابط ملف version.json المستضاف (مثال: 'https://USER.github.io/khatma/version.json').
// صيغة الملف: {"version":"2.04","url":"https://USER.github.io/khatma/"}. اتركه فارغًا لتعطيل التحقق.
const UPDATE_CHECK_URL = 'https://smartlamine-alt.github.io/Khatma/version.json';
let updateInfo = null;
function cmpVersion(a, b){
  const pa = String(a).split('.').map(n=>parseInt(n,10)||0);
  const pb = String(b).split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const d = (pa[i]||0) - (pb[i]||0);
    if(d !== 0) return d;
  }
  return 0;
}
async function checkForUpdate(){
  if(!UPDATE_CHECK_URL || !navigator.onLine) return;
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 5000);
    const r = await fetch(UPDATE_CHECK_URL + (UPDATE_CHECK_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache:'no-store', signal: ctrl.signal });
    clearTimeout(t);
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.version && cmpVersion(j.version, APP_VERSION) > 0){
      updateInfo = { version: String(j.version), url: j.url || '' };
      if(state && !versionWarning) render();
    }
  }catch(e){ /* بدون إنترنت أو الرابط غير متاح: نتجاهل بصمت */ }
}

async function loadState(){
  let raw = null;
  try{
    const db = await getDbCapability();
    if(db){
      const snap = await db.doc(DB_DOC_PATH).get();
      if(snap.exists){ raw = snap.data(); }
    } else if(hasClaudeStorage()){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ raw = JSON.parse(res.value); }
      if(!raw){
        for(const legacyKey of LEGACY_STORAGE_KEYS){
          const legacyRes = await window.storage.get(legacyKey, false).catch(()=>null);
          if(legacyRes && legacyRes.value){ raw = JSON.parse(legacyRes.value); break; }
        }
      }
    } else {
      const stored = localStorage.getItem(STORAGE_KEY);
      if(stored){ raw = JSON.parse(stored); }
      if(!raw){
        for(const legacyKey of LEGACY_STORAGE_KEYS){
          const legacyStored = localStorage.getItem(legacyKey);
          if(legacyStored){ raw = JSON.parse(legacyStored); break; }
        }
      }
    }
  }catch(e){ /* no saved state yet */ }

  versionWarning = null;
  state = migrateIfNeeded(raw);
  if(versionWarning){
    render();
    return;
  }
  if(!state){
    state = {
      numeralSystem: 'western',
      theme: 'emerald',
      calendarPref: 'hijri',
      version: APP_DATA_VERSION,
      khatmas: [ blankKhatma(todayStr(), 0) ]
    };
    await saveState();
  }
  if(!state.numeralSystem){ state.numeralSystem = 'western'; }
  if(!state.theme){ state.theme = 'emerald'; }
  if(!state.calendarPref){ state.calendarPref = 'hijri'; }
  if(!Array.isArray(state.khatmas) || state.khatmas.length===0){
    state.khatmas = [ blankKhatma(todayStr(), 0) ];
  }
  state.version = APP_DATA_VERSION;
  applyTheme();
  const changed1 = backfillKhatmaStatus();
  const changed2 = dedupeAllKhatmas();
  if(changed1 || changed2){ await saveState(); }
  render();

  // قاعدة بيانات المنشور تُغني عن ربط ملف/مجلد محلي — نتخطى ذلك إن كانت متاحة.
  if(dbCap){ fileLinkStatus = 'db'; return; }

  // إن وُجد ملف مرتبط سابقًا على هذا الجهاز/المتصفح، نحمّله فيتجاوز التخزين المحلي.
  await initFileLink();
  if(versionWarning){
    render();
    return;
  }
  if(fileLinkStatus === 'linked'){
    if(!state.numeralSystem) state.numeralSystem = 'western';
    if(!state.theme) state.theme = 'emerald';
    if(!state.calendarPref) state.calendarPref = 'hijri';
    if(!Array.isArray(state.khatmas) || state.khatmas.length===0){
      state.khatmas = [ blankKhatma(todayStr(), 0) ];
    }
    state.version = APP_DATA_VERSION;
    applyTheme();
    const changed1 = backfillKhatmaStatus();
  const changed2 = dedupeAllKhatmas();
  if(changed1 || changed2){ await saveState(); }
  }
  render();
  initGoogleAuthIfAvailable();
}

async function saveState(){
  if(versionWarning) return; // لا نكتب شيئًا أبدًا فوق ملف بإصدار أحدث.
  try{
    const db = await getDbCapability();
    if(db){
      await db.doc(DB_DOC_PATH).set(state);
      return;
    }
  }catch(e){ console.error('تعذر الحفظ في قاعدة البيانات', e); }
  try{
    if(hasClaudeStorage()){
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  }catch(e){ console.error('تعذر الحفظ', e); }
  if(fileLinkStatus === 'linked'){
    await writeToFileHandle();
  }
  if(driveStatus === 'linked'){
    await driveSave();
  }
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme === 'emerald' ? '' : state.theme);
}

function currentKhatma(){
  return state.khatmas[state.khatmas.length-1];
}
function historyKhatmas(){
  return state.khatmas.slice(0, -1);
}

function lastEntry(khatma){
  return khatma.entries.length ? khatma.entries[khatma.entries.length-1] : null;
}

function computeStatus(khatma){
  const dayIndex = Math.min(Math.max(daysBetween(khatma.startDate, todayStr()) + 1, 1), 9999);
  const duration = khatma.durationDays;
  const last = lastEntry(khatma);
  const progress = last ? last.cumulative : 0;
  const remaining = Math.max(TOTAL_AYAT - progress, 0);
  const daysLeft = Math.max(duration - dayIndex + 1, 0);
  const finished = remaining <= 0;
  const overdue = !finished && duration > 0 && dayIndex > duration;

  const juzPos = unitPosition(JUZ_BOUNDARIES, progress);
  const hizbPos = unitPosition(HIZB_BOUNDARIES, progress);

  // الوتيرة والتقدّم/التأخر يُحسبان بناءً على الأحزاب (60 حزبًا) لا الآيات مباشرة،
  // حتى تعكس المعدل اليومي المطلوب: 60 ÷ عدد الأيام حزبًا في اليوم.
  const hizbPerDay = duration > 0 ? 60/duration : 0;
  const idealHizbToday = Math.min(hizbPerDay * dayIndex, 60);
  const hizbDiff = hizbPos - idealHizbToday;
  const diffDays = hizbPerDay > 0 ? hizbDiff / hizbPerDay : 0;
  const diff = hizbDiff; // للتوافق مع أي استخدام سابق (بوحدة الأحزاب الآن)

  return { dayIndex, duration, progress, remaining, daysLeft, finished, overdue, diff, diffDays, hizbDiff, juzPos, hizbPos };
}

function statusClass(diffDays){
  if(diffDays > 0.4) return 'ahead';
  if(diffDays < -0.4) return 'behind';
  return 'onpace';
}

function fmt(n){ return nd(Math.round(n)); }
function fmt1(n){ return nd(n.toFixed(1)); }
function fmtSmart(n){
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? nd(rounded) : nd(rounded.toFixed(1));
}

function overdueLabel(days){
  if(days === 1) return 'ختم القرآن متأخر بيوم';
  if(days === 2) return 'ختم القرآن متأخر بيومين';
  return 'ختم القرآن متأخر ب' + nd(days) + ' أيام';
}

// وتيرة القراءة اليوم مقارنة بالمقدار اليومي (60 حزبًا ÷ عدد أيام الختمة)، معبَّرًا عنها بالأحزاب.
function paceHizbLabel(hizbDiff){
  const n = Math.round(Math.abs(hizbDiff));
  if(n === 0) return null;
  const noun = n === 1 ? 'حزب' : (n === 2 ? 'حزبين' : nd(n) + ' أحزاب');
  return (hizbDiff > 0 ? 'متقدم بـ ' : 'متأخر بـ ') + noun;
}

function completedDaysTaken(khatma){
  // Returns number of days from start to the entry where the khatma was completed, or null.
  for(const e of khatma.entries){
    if(e.cumulative >= TOTAL_AYAT){
      return daysBetween(khatma.startDate, e.date) + 1;
    }
  }
  return null;
}

async function downloadJSON(filename, dataStr){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        await downloads.save({ filename, data: dataStr });
        return;
      }
    }
  }catch(e){ /* fall through */ }
  try{
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    appAlert('تعذّر تنزيل الملف على هذا المتصفح.');
  }
}

// نوافذ التنبيه والتأكيد بنفس شكل بطاقة الدليل التفاعلي (بديل alert/confirm)
// خيار التعديل للختمة المكتملة: الاسم فقط.
function nameOnlyEdit(k){ return k.status !== 'cancelled' && completedDaysTaken(k) !== null; }

function askDialog(message, opts){
  opts = opts || {};
  const isConfirm = !!opts.confirm;
  const choices = opts.choices || null; // [{label, value}] — الأول هو الافتراضي
  return new Promise(resolve => {
    const bd = document.createElement('div');
    bd.className = 'dlg-backdrop';
    const esc = (t) => escHtml(String(t)).replace(/\n/g, '<br>');
    const actions = choices
      ? `<button type="button" class="ghost" id="dlgCancel">${esc(opts.cancel || 'إغلاق')}</button>` + choices.map((c, ix) => `<button type="button" class="${ix === 0 ? 'primary' : 'ghost'} dlg-choice" data-v="${esc(c.value)}">${esc(c.label)}</button>`).join('')
      : `${isConfirm ? `<button type="button" class="ghost" id="dlgCancel">${esc(opts.cancel || 'إلغاء')}</button>` : ''}<button type="button" class="primary" id="dlgOk">${esc(opts.ok || (isConfirm ? 'موافق' : 'حسنًا'))}</button>`;
    bd.innerHTML = `<div class="tuto-card" role="alertdialog" aria-modal="true">
      <div class="tuto-top"><span class="tuto-kicker">${isConfirm ? 'تأكيد' : 'تنبيه'}</span></div>
      <h3>${esc(opts.title || (isConfirm ? 'تأكيد' : 'تنبيه ⚠'))}</h3>
      <p>${esc(message)}</p>
      <div class="dlg-actions">${actions}</div></div>`;
    const done = (v) => { document.removeEventListener('keydown', onKey, true); bd.remove(); resolve(v); };
    const onKey = (e) => {
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done(false); }
      else if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); done(choices ? choices[0].value : true); }
    };
    const ok = bd.querySelector('#dlgOk');
    if(ok) ok.addEventListener('click', () => done(true));
    bd.querySelectorAll('.dlg-choice').forEach(btn => btn.addEventListener('click', () => done(btn.dataset.v)));
    const c = bd.querySelector('#dlgCancel');
    if(c) c.addEventListener('click', () => done(false));
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(bd);
    (ok || bd.querySelector('.dlg-choice')).focus();
  });
}
const appAlert = (m, o) => askDialog(m, Object.assign({}, o, { confirm: false }));
const appConfirm = (m, o) => askDialog(m, Object.assign({}, o, { confirm: true }));

      b:'يفتح نموذجًا فيه: <b>تاريخ البدء</b>، <b>عدد الأيام</b>، <b>الوصف</b> (اسم اختياري)، <b>الرواية</b>.<br>• «تأكيد البدء» يحفظ الختمة الحالية في السجل ويبدأ الجديدة؛ «إلغاء» يغلق النموذج.<br>• أثناء فتح النموذج تُعتَّم بقية الصفحة ويتعطّل التسجيل، ويعرض سورة الفاتحة.<br>• اسم جديد = ختمة جديدة؛ نفس الاسم = دورة جديدة لنفس الختمة.' },
    { t:'تسجيل الموضع الحالي', sel: () => document.querySelector('section.hero'),
      b:'اختر السورة والآية والتاريخ ثم «تحديث».<br>• التاريخ: لا قبل بداية الختمة ولا بعد اليوم.<br>• لا تُقبل آية سبق تسجيلها في نفس الختمة.<br>• «✎ تعديل آخر تسجيل» يصحّح آخر سطر.<br>• السورة الحالية تظهر أولًا في القائمة.<br>• عند أول تسجيل في أداة فارغة يظهر نموذج بيانات الختمة (البداية، الأيام، الاسم، الرواية) وتُعتَّم بقية الصفحة.' },
    { t:'السجل', pre: () => { showKhatmaData = true; }, sel: () => document.querySelector('#mainContent > section'),
      b:'كل سطر تسجيل. <b>التراكم اليومي</b> = أحزاب السطر − آخر موضع في اليوم السابق.<br>• أقل من المقدار اليومي ← السطر <b style="color:#E5322D">أحمر</b>.<br>• أكبر منه ← السطر <b style="color:#E8C547">أصفر</b>.<br>الدورات السابقة مطويّة بزر <b>+</b> يفتح تفاصيلها.' },
    { t:'إتمام الختمة وإعادتها', sel: () => document.querySelector('section.hero'),
      b:'عند تسجيل سورة الناس آية 6 تظهر تهنئة وسؤال: إعادة الختمة؟<br>«نعم» يفتح نموذجًا بنفس الاسم (يمكن تغيير التاريخ والأيام والرواية) وتُعدّ <b>دورة جديدة لنفس الختمة</b>، ثم يبدأ التسجيل من الفاتحة.' },
    { t:'قائمة الختمات', pre: () => { showKhatmaList = true; }, sel: () => document.getElementById('khatmaListContent'),
      b:'اسم واحد لكل ختمة، وتحته دوراتها بتواريخها وحالة كل دورة (جارية / مكتملة / ملغاة).<br>الأزرار: تعديل (للمكتملة: الاسم فقط والباقي مُعتَّم؛ تغيير الاسم يشمل كل الدورات)، إلغاء، أرشفة (للمكتملة أو الملغاة فقط؛ الجارية تُلغى ثم تُؤرشف بعد تأكيدك)، إعادة، حذف.<br>الختمة الملغاة لا تقبل تسجيلًا جديدًا: تُعرض عليك «استئناف» أو «من البداية».' },
    { t:'النسخة الاحتياطية المحلية', sel: () => document.querySelector('.backup-section'),
      b:'اربط ملفًا أو مجلدًا لحفظ بياناتك تلقائيًا بصيغة JSON. يظهر مؤشر «ملف JSON محدَّث» مع آخر وقت حفظ وموضع الملف.<br>إن طلب المتصفح إذنًا جديدًا تُعتَّم الصفحة حتى تضغط «منح الإذن ومتابعة».' }
  ];
  let i = 0, hidden = false;
  const card = document.createElement('div');
  card.className = 'tuto-card';
  card.setAttribute('role', 'dialog');
  const chip = document.createElement('button');
  chip.type = 'button'; chip.className = 'tuto-chip'; chip.style.display = 'none';
  chip.textContent = '📖 متابعة الدليل';
  const arrow = document.createElement('div');
  arrow.className = 'tuto-arrow';
  arrow.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path d="M8 2h8v7h6L12 22 2 9h6z" fill="#E5322D" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  const visible = (el) => !!el && el.getClientRects().length > 0;
  const place = () => {
    const el = steps[i].sel();
    if(hidden || !visible(el)){ arrow.style.display = 'none'; return; }
    const r = el.getBoundingClientRect();
    arrow.style.display = 'block';
    arrow.style.top = Math.max(4, r.top - 40) + 'px';
    arrow.style.left = Math.min(window.innerWidth - 42, Math.max(4, r.right - 46)) + 'px';
  };
  const goTo = () => {
    const el = steps[i].sel();
    if(visible(el)){
      const y = el.getBoundingClientRect().top + window.scrollY - 64;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }
    setTimeout(place, 450);
  };
  const draw = () => {
    const before = [showSettings, showKhatmaData, showKhatmaList].join();
    if(steps[i].pre) steps[i].pre();
    if([showSettings, showKhatmaData, showKhatmaList].join() !== before || currentView !== 'khatma'){ currentView = 'khatma'; render(); }
    const st = steps[i];
    card.innerHTML = `<div class="tuto-top"><span class="tuto-kicker">دليل تفاعلي</span><span class="tuto-mini"><button type="button" class="ghost" id="tutoHide">إخفاء</button><button type="button" class="ghost" id="tutoX" aria-label="إغلاق">✕</button></span></div>
      <h3>${st.t}</h3><p>${st.b}</p>
      <div class="tuto-dots">${steps.map((_, k) => `<span class="${k === i ? 'on' : ''}"></span>`).join('')}</div>
      <div class="tuto-actions"><button type="button" class="ghost" id="tutoPrev" ${i === 0 ? 'disabled' : ''}>السابق</button><span>${nd(i + 1)} / ${nd(steps.length)}</span><button type="button" class="primary" id="tutoNext">${i === steps.length - 1 ? 'إنهاء' : 'التالي'}</button></div>`;
    card.querySelector('#tutoPrev').addEventListener('click', () => { if(i > 0){ i--; draw(); } });
    card.querySelector('#tutoNext').addEventListener('click', () => { if(i < steps.length - 1){ i++; draw(); } else close(); });
    card.querySelector('#tutoHide').addEventListener('click', hide);
    card.querySelector('#tutoX').addEventListener('click', close);
    goTo();
  };
  const hide = () => { hidden = true; card.style.display = 'none'; chip.style.display = 'block'; arrow.style.display = 'none'; };
  const show = () => { hidden = false; card.style.display = ''; chip.style.display = 'none'; place(); };
  const onKey = (e) => { if(e.key === 'Escape') hide(); };
  const timer = setInterval(place, 600);
  const close = () => {
    clearInterval(timer);
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('scroll', place);
    window.removeEventListener('resize', place);
    card.remove(); chip.remove(); arrow.remove();
    tutorialActive = null;
    if(saved.showSettings !== showSettings || saved.showKhatmaData !== showKhatmaData || saved.showKhatmaList !== showKhatmaList){
      showSettings = saved.showSettings; showKhatmaData = saved.showKhatmaData; showKhatmaList = saved.showKhatmaList;
      render();
    }
  };
  chip.addEventListener('click', show);
  document.addEventListener('keydown', onKey);
  window.addEventListener('scroll', place, { passive: true });
  window.addEventListener('resize', place);
  document.body.append(arrow, card, chip);
  tutorialActive = { show };
  draw();
}

// قسم «مكتبتي»: هيكل مستقل عن الختمة (المنطق يُضاف لاحقًا).
function libraryViewHtml(){
  return `<section id="libraryView"><h2>مكتبتي</h2><div class="note">قسم مستقل عن الختمة — سيُضاف نموذجه ومنطقه لاحقًا.</div></section>`;
}

function render(){
  if(versionWarning){ renderVersionBlock(); return; }
  const app = document.getElementById('app');

  const viewIdx = (selectedKhatmaIdx === null || selectedKhatmaIdx < 0 || selectedKhatmaIdx >= state.khatmas.length)
    ? state.khatmas.length - 1 : selectedKhatmaIdx;
  const viewedKhatma = state.khatmas[viewIdx];

  const khatma = viewedKhatma; // بطاقة "تسجيل الموضع الحالي" و"الختمة الحالية" تعكسان الختمة المختارة من القائمة
  const st = computeStatus(khatma);
  const sCls = statusClass(st.diffDays);
  const last = lastEntry(khatma);
  const history = historyKhatmas();

  const vSt = st;
  const vSCls = sCls;

  const completedCount = history.filter(k => completedDaysTaken(k) !== null).length
    + (computeStatus(currentKhatma()).finished ? 1 : 0) + (state.legacyCompletedCount || 0);

  const khatmaGroups = [];
  state.khatmas.forEach((k, i)=>{
    const nm = khatmaName(k);
    let g = khatmaGroups.find(x => x.name === nm);
    if(!g){ g = { name: nm, idxs: [] }; khatmaGroups.push(g); }
    g.idxs.push(i);
  });
  const viewName = khatmaName(viewedKhatma);
  const khatmaViewOptions = khatmaGroups
    .filter(g => g.name === viewName || g.idxs.some(i => !state.khatmas[i].archived))
    .map(g => {
      const li = g.idxs[g.idxs.length - 1];
      const k = state.khatmas[li];
      const isCurrent = li === state.khatmas.length - 1;
      const label = escHtml(g.name) + (g.idxs.length > 1 ? ' ×' + nd(g.idxs.length) : '') + ' — ' + dateDisplayInline(k.startDate) + ' — ' + nd(k.durationDays) + ' يوم' + (isCurrent ? ' (الحالية)' : '');
      return `<option value="${isCurrent ? 'current' : String(li)}" ${g.name === viewName ? 'selected' : ''}>${label}</option>`;
    }).join('');

  const completedNameCounts = {};
  state.khatmas.forEach((k)=>{
    if(completedDaysTaken(k) !== null){
      const nm = khatmaName(k);
      completedNameCounts[nm] = (completedNameCounts[nm] || 0) + 1;
    }
  });

  const archivedCount = state.khatmas.filter(k=>k.archived).length;
  const visibleKhatmas = state.khatmas.filter(k => showArchivedKhatmas || !k.archived);

  const roundRowFn = (k)=>{
    const i = state.khatmas.indexOf(k);
    const isCurrent = i === state.khatmas.length - 1;
    const kEnd = addDays(k.startDate, Math.max(k.durationDays, 1) - 1);
    const kLast = lastEntry(k);
    const kProgress = kLast ? kLast.cumulative : 0;
    const kDays = completedDaysTaken(k);
    const nm = khatmaName(k);
    const timesCount = completedNameCounts[nm] || 0;
    const timesLabel = timesCount > 1 ? ` <span class="sub-date" style="display:inline;">(×${nd(timesCount)})</span>` : '';

    let statusHtml, canCancel;
    if(k.status === 'cancelled'){
      statusHtml = `<span class="tag behind">ملغاة — ${fmt(kProgress)} / ${fmt(TOTAL_AYAT)}</span>`;
      canCancel = false;
    } else if(kDays !== null){
      statusHtml = `<span class="tag done">مكتملة خلال ${nd(kDays)} يوم</span>`;
      canCancel = false;
    } else {
      statusHtml = `<span class="tag pending">جارية — ${fmt(kProgress)} / ${fmt(TOTAL_AYAT)}</span>`;
      canCancel = true;
    }

    if(editingKhatmaIdx === i){
      const lockRest = nameOnlyEdit(k);
      return `<tr class="khatma-edit-row"><td colspan="4">
        <div class="row">
          <div class="field">
            <label for="editKhatmaDesc_${i}">الاسم <small>(يشمل كل دورات هذه الختمة)</small></label>
            <input type="text" id="editKhatmaDesc_${i}" value="${escHtml(k.description || '')}" placeholder="خ${nd(i+1)}" maxlength="60">
          </div>
          <div class="field${lockRest ? ' field-locked' : ''}">
            <label for="editKhatmaRiwaya_${i}">الرواية</label>
            ${lockRest ? riwayaSelectHtml('editKhatmaRiwaya_'+i, k.riwaya || '').replace('<select', '<select disabled') : riwayaSelectHtml('editKhatmaRiwaya_'+i, k.riwaya || '')}
          </div>
        </div>
        <div class="row">
          <div class="field${lockRest ? ' field-locked' : ''}">
            <label for="editKhatmaStart_${i}">تاريخ البدء</label>
            ${state.calendarPref === 'hijri'
              ? hijriSingleInputHtml('editKhatmaStart_'+i, k.startDate, lockRest)
              : `<input type="date" id="editKhatmaStart_${i}" value="${k.startDate}" ${lockRest ? 'disabled' : ''}>`}
          </div>
          <div class="field${lockRest ? ' field-locked' : ''}">
            <label for="editKhatmaDur_${i}">عدد الأيام</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="editKhatmaDur_${i}" value="${nd(k.durationDays)}" ${lockRest ? 'disabled' : ''}>
          </div>
        </div>
        <div class="actions">
          <button class="primary edit-khatma-save" data-idx="${i}">حفظ</button>
          <button class="ghost edit-khatma-cancel">إلغاء</button>
        </div>
      </td></tr>`;
    }

    if(k.archived){
      return `<tr class="archived-row">
        <td><span class="round-dates">${dateTextCompact(k.startDate)} → ${dateTextCompact(kEnd)}</span>${k.riwaya ? ' <span class="sub-date" style="display:inline;">(' + escHtml(k.riwaya) + ')</span>' : ''}</td>
        <td>${nd(k.durationDays)} يوم</td>
        <td>${statusHtml}</td>
        <td>
          <button class="ghost unarchive-khatma-btn" data-idx="${i}" title="إلغاء الأرشفة">📤 إظهار</button>
          <button class="ghost delete-khatma-btn" data-idx="${i}" title="حذف نهائي">🗑</button>
        </td>
      </tr>`;
    }

    return `<tr>
      <td><span class="round-dates">${dateTextCompact(k.startDate)} → ${dateTextCompact(kEnd)}</span>${k.riwaya ? ' <span class="sub-date" style="display:inline;">(' + escHtml(k.riwaya) + ')</span>' : ''}</td>
      <td>${nd(k.durationDays)} يوم</td>
      <td>${statusHtml}</td>
      <td>
        <button class="ghost edit-khatma-btn" data-idx="${i}" title="${nameOnlyEdit(k) ? 'تعديل الاسم' : 'تعديل'}">✎</button>
        ${k.status === 'cancelled' ? `
          <button class="ghost resume-khatma-btn" data-idx="${i}" title="استئناف">▶ استئناف</button>
          <button class="ghost relance-khatma-btn" data-idx="${i}" title="إعادة من البداية">🔁 من البداية</button>
        ` : `
          ${kDays !== null ? `<button class="ghost relance-khatma-btn" data-idx="${i}" title="إعادة">🔁</button>` : ''}
          ${canCancel ? `<button class="ghost cancel-khatma-btn" data-idx="${i}" title="إلغاء الختمة">🚫</button>` : ''}
        `}
        <button class="ghost archive-khatma-btn" data-idx="${i}" title="أرشفة (للمكتملة أو الملغاة)">📦</button>
        <button class="ghost delete-khatma-btn" data-idx="${i}" title="حذف نهائي">🗑</button>
      </td>
    </tr>`;
  };
  const listGroups = [];
  visibleKhatmas.slice().reverse().forEach(k => {
    const nm = khatmaName(k);
    let g = listGroups.find(x => x.nm === nm);
    if(!g){ g = { nm, ks: [] }; listGroups.push(g); }
    g.ks.push(k);
  });
  const khatmaListRows = listGroups.map(g =>
    `<tr class="khatma-group-row"><td colspan="4"><b>${escHtml(g.nm)}</b></td></tr>` + g.ks.map(roundRowFn).join('')
  ).join('');

  const ledgerTableHtml = (vk) => {
  if(vk.entries.length === 0){
    return `<div class="ledger-empty">لم تُسجَّل أي قراءة بعد في هذه الختمة. سجّل موضعك الحالي لتبدأ الحساب.</div>`;
  } else {
    const reversedEntries = vk.entries.slice().reverse();
    const baseHizbByDate = {};
    { let lastDate = null, lastHizb = null;
      for(const e of vk.entries){
        if(e.date !== lastDate){ baseHizbByDate[e.date] = lastHizb; lastDate = e.date; }
        lastHizb = unitPosition(HIZB_BOUNDARIES, e.cumulative);
      }
    }
    const dailyHizbQuota = vk.durationDays > 0 ? 60/vk.durationDays : 0;
    const groups = [];
    for(const e of reversedEntries){
      if(groups.length && groups[groups.length-1].date === e.date){
        groups[groups.length-1].items.push(e);
      } else {
        groups.push({ date: e.date, items: [e] });
      }
    }
    const rows = groups.map(g => {
      return g.items.map((e, idx)=>{
        const dIdx = Math.min(Math.max(daysBetween(vk.startDate, e.date)+1,1), 9999);
        const eHizb = unitPosition(HIZB_BOUNDARIES, e.cumulative);
        const hizbPerDayE = vk.durationDays > 0 ? 60/vk.durationDays : 0;
        const idealHizbE = Math.min(hizbPerDayE*dIdx, 60);
        const dHizb = eHizb - idealHizbE;
        const cls = statusClass(hizbPerDayE > 0 ? dHizb/hizbPerDayE : 0);
        const label = cls==='ahead' ? 'متقدم' : (cls==='behind' ? 'متأخر' : 'في الموعد');
        const ePages = e.cumulative * APPROX_PAGES / TOTAL_AYAT;
        const eJuz = unitPosition(JUZ_BOUNDARIES, e.cumulative);
        const dateCell = idx===0 ? `<td rowspan="${g.items.length}">${dateDisplayLedger(g.date)}</td>` : '';
        const r1 = x => Math.round(x*10)/10;
        const dailyCum = baseHizbByDate[e.date] == null ? null : r1(r1(eHizb) - r1(baseHizbByDate[e.date]));
        const overQuota = dailyHizbQuota > 0 && dailyCum !== null && dailyCum > dailyHizbQuota + 0.05;
        const underQuota = dailyHizbQuota > 0 && dailyCum !== null && dailyCum < dailyHizbQuota - 0.05;
        return `<tr${overQuota ? ' class="over-quota"' : (underQuota ? ' class="under-quota"' : '')}>${dateCell}
        <td class="time-col">${e.time ? nd(e.time) : '—'}</td>
        <td class="hizb-col">${fmtSmart(eHizb)} / ${fmtSmart(idealHizbE)}</td>
        <td class="hizb-col">${dailyCum === null ? '—' : fmtSmart(dailyCum)}</td>
        <td>${SURAHS[e.surahIdx][0]} : ${nd(e.ayah)}</td>
        <td>${fmtSmart(eJuz)}</td>
        <td>${fmt(e.cumulative)} / ${fmt(TOTAL_AYAT)}</td>
        <td>${fmt(ePages)} / ${fmt(APPROX_PAGES)}</td>
        <td><span class="tag ${cls}">${label}</span></td>
      </tr>`;
      }).join('');
    }).join('');
    return `<div class="table-scroll"><table class="ledger-table">
      <thead><tr><th>التاريخ</th><th class="time-col">الوقت</th><th class="hizb-col">الأحزاب<br><small>(المقروء/المطلوب)</small></th><th class="hizb-col">التراكم<br><small>اليومي</small></th><th>الموضع الحالي</th><th>الأجزاء</th><th>الآيات</th><th>الصفحات</th><th>الحالة</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  };
  const olderRounds = state.khatmas.map((k, i) => ({ k, i })).filter(o => o.i < viewIdx && khatmaName(o.k) === viewName);
  const olderRoundsHtml = olderRounds.slice().reverse().map(o => {
    const d = completedDaysTaken(o.k);
    const le = lastEntry(o.k);
    const stTag = d !== null ? `<span class="tag done">مكتملة خلال ${nd(d)} يوم</span>`
      : (o.k.status === 'cancelled' ? `<span class="tag behind">ملغاة</span>` : `<span class="tag pending">${fmt(le ? le.cumulative : 0)} / ${fmt(TOTAL_AYAT)}</span>`);
    const open = expandedRounds.has(o.i);
    return `<div class="old-round"><button type="button" class="ghost round-toggle" data-idx="${o.i}" aria-expanded="${open}">${open ? '−' : '+'}</button><span>${dateTextCompact(o.k.startDate)}${o.k.riwaya ? ' (' + escHtml(o.k.riwaya) + ')' : ''}</span>${stTag}</div>${open ? ledgerTableHtml(o.k) : ''}`;
  }).join('');
  const ledgerRows = ledgerTableHtml(viewedKhatma) + olderRoundsHtml;

  let historyRows = '';
  if(history.length === 0){
    historyRows = `<div class="ledger-empty">لا توجد ختمات سابقة بعد.</div>`;
  } else {
    const rows = history.slice().reverse().map((k)=>{
      const days = completedDaysTaken(k);
      const endDate = addDays(k.startDate, Math.max(k.durationDays, 1) - 1);
      const lastE = lastEntry(k);
      const progress = lastE ? lastE.cumulative : 0;
      const statusHtml = days !== null
        ? `<span class="tag done">اكتملت خلال ${nd(days)} يوم</span>`
        : `<span class="tag pending">${fmt(progress)} / ${fmt(TOTAL_AYAT)}</span>`;
      return `<tr>
        <td><b>${escHtml(khatmaName(k))}</b>${k.riwaya ? ' <span class="sub-date" style="display:inline;">(' + escHtml(k.riwaya) + ')</span>' : ''}<span class="sub-date">${nd(k.startDate)} → ${nd(endDate)}</span></td>
        <td>${nd(k.durationDays)} يوم</td>
        <td>${statusHtml}</td>
      </tr>`;
    }).join('');
    historyRows = `<table>
      <thead><tr><th>الفترة</th><th>المخطط</th><th>النتيجة</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  const lastIsFinal = (!!last && last.cumulative >= TOTAL_AYAT && !editingLast) || showNewKhatmaForm; // ختمة مكتملة أو جديدة/إعادة ← البدء من الفاتحة
  const selectedSurah = (last && !lastIsFinal) ? last.surahIdx : 0;
