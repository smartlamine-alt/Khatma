  }

  if(document.getElementById('editLastBtn')){
    document.getElementById('editLastBtn').addEventListener('click', ()=>{ editingLast = true; showNewKhatmaForm = false; render(); });
  }
  if(document.getElementById('cancelEditBtn')){
    document.getElementById('cancelEditBtn').addEventListener('click', ()=>{ editingLast = false; render(); });
  }

  if(document.getElementById('updateNowBtn')){
    document.getElementById('updateNowBtn').addEventListener('click', ()=>{
      const u = updateInfo && updateInfo.url;
      if(!u){ location.reload(); return; }
      location.href = u + (u.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(updateInfo.version);
    });
  }

  document.getElementById('viewToggleBtn').addEventListener('click', ()=>{
    showKhatmaData = !showKhatmaData;
    render();
  });

  document.getElementById('khatmaListToggleBtn').addEventListener('click', ()=>{
    showKhatmaList = !showKhatmaList;
    if(!showKhatmaList){ editingKhatmaIdx = null; }
    render();
  });

  document.getElementById('settingsToggleBtn').addEventListener('click', ()=>{
    showSettings = !showSettings;
    render();
  });

  document.getElementById('surahSel').value = selectedSurah;

  document.querySelectorAll('.hijri-cal-btn').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', ()=> openHijriCalendarFor(btn.id.replace(/HijriBtn$/, '')));
  });
  document.querySelectorAll('.hijri-single').forEach(inp=>{
    if(inp.disabled) return;
    inp.addEventListener('click', ()=> openHijriCalendarFor(inp.id.replace(/Hijri$/, '')));
  });

  document.getElementById('durationInput').addEventListener('change', async (e)=>{
    let dur = parseInt(normalizeDigits(e.target.value), 10);
    if(isNaN(dur) || dur < 0) dur = khatma.durationDays;
    khatma.durationDays = dur;
    await saveState();
    render();
  });

  if(showNewKhatmaForm){
    document.getElementById('confirmNewKhatmaBtn').addEventListener('click', async ()=>{
      const newStart = state.calendarPref === 'hijri' ? readHijriSingleIso('newStart') : (document.getElementById('newStartInput').value || todayStr());
      let newDur = parseInt(normalizeDigits(document.getElementById('newDurationInput').value), 10);
      if(isNaN(newDur) || newDur < 0) newDur = 0;
      const newDesc = document.getElementById('newDescInput').value.trim();
      const newRiwaya = document.getElementById('newRiwayaInput').value.trim();
      const inPlace = emptySetupKhatma;
      if(inPlace){
        Object.assign(inPlace, { startDate: newStart, durationDays: newDur, description: newDesc, riwaya: newRiwaya });
        firstSetupDone = true;
        emptySetupKhatma = null;
      } else {
        state.khatmas.push(blankKhatma(newStart, newDur, newDesc, newRiwaya));
        selectedKhatmaIdx = null;
      }
      showNewKhatmaForm = false;
      newKhatmaPrefill = null;
      editingLast = false;
      await saveState();
      render();
      restorePendingFirstEntry();
    });
    document.getElementById('cancelNewKhatmaBtn').addEventListener('click', ()=>{
      if(emptySetupKhatma){ firstSetupDone = true; emptySetupKhatma = null; }
      showNewKhatmaForm = false;
      newKhatmaPrefill = null;
      render();
      restorePendingFirstEntry();
    });
  } else {
    document.getElementById('newKhatmaBtn').addEventListener('click', async ()=>{
      if(!st.finished){
        const ok = await appConfirm('لم تُكمل الختمة الحالية بعد (' + fmt(st.progress) + ' / ' + fmt(TOTAL_AYAT) + ' آية). هل تريد المتابعة وبدء ختمة جديدة رغم ذلك؟');
        if(!ok) return;
      }
      newKhatmaPrefill = null;
      showNewKhatmaForm = true;
      render();
    });
  }

  document.querySelectorAll('.edit-khatma-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingKhatmaIdx = parseInt(btn.dataset.idx, 10);
      showKhatmaList = true;
      render();
    });
  });
  document.querySelectorAll('.edit-khatma-cancel').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingKhatmaIdx = null;
      render();
    });
  });
  document.querySelectorAll('.edit-khatma-save').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      const k = state.khatmas[i];
      const newDesc = document.getElementById('editKhatmaDesc_'+i).value.trim();
      const newRiwaya = document.getElementById('editKhatmaRiwaya_'+i).value.trim();
      const newStart = state.calendarPref === 'hijri'
        ? readHijriSingleIso('editKhatmaStart_'+i)
        : (document.getElementById('editKhatmaStart_'+i).value || k.startDate);
      let newDur = parseInt(normalizeDigits(document.getElementById('editKhatmaDur_'+i).value), 10);
      if(isNaN(newDur) || newDur < 1) newDur = k.durationDays;
      const oldName = khatmaName(k);
      const sameGroup = state.khatmas.filter(x => khatmaName(x) === oldName);
      sameGroup.forEach(x => { x.description = newDesc || oldName; });
      if(!nameOnlyEdit(k)){
        k.riwaya = newRiwaya;
        k.startDate = newStart;
        k.durationDays = newDur;
      }
      editingKhatmaIdx = null;
      await saveState();
      render();
    });
  });
  document.querySelectorAll('.relance-khatma-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      const k = state.khatmas[i];
      newKhatmaPrefill = { description: khatmaName(k), riwaya: k.riwaya || '', durationDays: k.durationDays };
      showNewKhatmaForm = true;
      render();
    });
  });

  document.querySelectorAll('.cancel-khatma-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      const k = state.khatmas[i];
      const ok = await appConfirm('هل تريد إلغاء "' + khatmaName(k) + '"؟', { ok: 'نعم', cancel: 'لا' });
      if(!ok) return;
      k.status = 'cancelled';
      await saveState();
      render();
    });
  });

  document.querySelectorAll('.resume-khatma-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      const k = state.khatmas[i];
      k.status = 'ongoing';
      await saveState();
      render();
    });
  });

  document.querySelectorAll('.archive-khatma-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      const k = state.khatmas[i];
      if(k.status !== 'cancelled' && completedDaysTaken(k) === null){
        const ok = await appConfirm('«' + khatmaName(k) + '» ما زالت جارية، ولا تُؤرشف إلا الختمة المكتملة أو الملغاة.\nهل تريد إلغاءها ثم أرشفتها؟', { title: 'أرشفة ختمة جارية', ok: 'إلغاء وأرشفة', cancel: 'تراجع' });
        if(!ok) return;
        k.status = 'cancelled';
      }
      k.archived = true;
      await saveState();
      render();
    });
  });

  document.querySelectorAll('.unarchive-khatma-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      state.khatmas[i].archived = false;
      await saveState();
      render();
    });
  });

  document.querySelectorAll('.delete-khatma-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      const k = state.khatmas[i];
      const ok = await appConfirm('حذف "' + khatmaName(k) + '" نهائيًا مع كل تسجيلاتها؟ لا يمكن التراجع عن هذا.', { title: 'حذف نهائي', ok: 'حذف', cancel: 'تراجع' });
      if(!ok) return;
      state.khatmas.splice(i, 1);
      if(state.khatmas.length === 0){
        state.khatmas.push(blankKhatma(todayStr(), 15));
      }
      selectedKhatmaIdx = null;
      editingKhatmaIdx = null;
      editingLast = false;
      await saveState();
      render();
    });
  });

  document.querySelectorAll('.round-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.idx, 10);
      if(expandedRounds.has(i)) expandedRounds.delete(i); else expandedRounds.add(i);
      render();
    });
  });

  if(document.getElementById('toggleArchivedBtn')){
    document.getElementById('toggleArchivedBtn').addEventListener('click', ()=>{
      showArchivedKhatmas = !showArchivedKhatmas;
      render();
    });
  }

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    if(showNewKhatmaForm) return;
    if(khatma.status === 'cancelled'){
      const choice = await askDialog('الختمة «' + khatmaName(khatma) + '» ملغاة، ولا يمكن تسجيل قيم جديدة فيها.\nاختر: متابعتها من حيث توقفت، أو إعادتها من البداية.', {
        confirm: true, title: 'ختمة ملغاة ⚠', cancel: 'إغلاق',
        choices: [{ label: '▶ استئناف', value: 'resume' }, { label: '🔁 من البداية', value: 'restart' }]
      });
      if(choice === 'resume'){
        khatma.status = 'ongoing';
        await saveState();
        render();
      } else if(choice === 'restart'){
        newKhatmaPrefill = { description: khatmaName(khatma), riwaya: khatma.riwaya || '', durationDays: khatma.durationDays };
        showNewKhatmaForm = true;
        render();
      }
      return;
    }
    if(!firstSetupDone && state.khatmas.every(k => k.entries.length === 0)){
      pendingFirstEntry = {
        surahIdx: document.getElementById('surahSel').value,
        ayah: document.getElementById('ayahInput').value,
        date: state.calendarPref === 'hijri' ? readHijriSingleIso('entryDate') : (document.getElementById('entryDateInput').value || todayStr())
      };
      emptySetupKhatma = khatma;
      newKhatmaPrefill = { description: khatma.description || '', riwaya: khatma.riwaya || '', durationDays: khatma.durationDays, startDate: khatma.startDate };
      showNewKhatmaForm = true;
      render();
      return;
    }
    const surahIdx = parseInt(document.getElementById('surahSel').value, 10);
    let ayah = parseInt(normalizeDigits(document.getElementById('ayahInput').value), 10);
    if(isNaN(ayah) || ayah < 1) ayah = 1;
    if(ayah > SURAHS[surahIdx][1]) ayah = SURAHS[surahIdx][1];
    const cumulative = cumulativeAyat(surahIdx, ayah);
    let date = state.calendarPref === 'hijri' ? readHijriSingleIso('entryDate') : (document.getElementById('entryDateInput').value || todayStr());
    if(date < khatma.startDate){
      await appAlert('لا يمكن تسجيل تاريخ قبل بداية الختمة (' + dateDisplayInline(khatma.startDate) + ').');
      return;
    }
    if(date > todayStr()) date = todayStr();
    const editing = editingLast && khatma.entries.length > 0;
    const others = editing ? khatma.entries.slice(0, -1) : khatma.entries;
    const time = editing ? (khatma.entries[khatma.entries.length-1].time || nowTimeStr()) : nowTimeStr();
    const dup = others.find(e => e.surahIdx === surahIdx && e.ayah === ayah);
    if(dup){
      await appAlert('هذا الموضع (' + SURAHS[surahIdx][0] + ' : ' + nd(ayah) + ') مسجَّل مسبقًا في هذه الختمة بتاريخ ' + dateDisplayInline(dup.date) + '. لا يمكن تسجيل آية سبق تسجيلها، حتى بتاريخ لاحق.');
      return;
    }
    const check = validateEntryOrder({ entries: others }, date, time, cumulative);
    if(!check.ok){
      await appAlert(check.message);
      return;
    }
    const entry = { date, surahIdx, ayah, cumulative, time };
    const finishedNow = cumulative >= TOTAL_AYAT && !others.some(x => x.cumulative >= TOTAL_AYAT);
    if(editing){
      khatma.entries = others.concat([entry]);
      editingLast = false;
    } else {
      khatma.entries.push(entry);
    }
    khatma.entries.sort((a,b)=> entryDateTime(a).localeCompare(entryDateTime(b)));
    if(finishedNow) khatma.status = 'completed';
    await saveState();
    render();
    if(finishedNow){
      setTimeout(async ()=>{
        const days = completedDaysTaken(khatma);
        const relaunch = await appConfirm('أتممت الختمة «' + khatmaName(khatma) + '»' + (days !== null ? ' خلال ' + nd(days) + ' يوم' : '') + '.\nتقبّل الله منك.\n\nهل تريد إعادة الختمة بنفس الإعدادات؟ (يمكنك تغيير التاريخ والرواية)', { title: '🎉 مبارك!', ok: 'نعم، أعد الختمة', cancel: 'لا' });
        if(relaunch){
          newKhatmaPrefill = { description: khatmaName(khatma), riwaya: khatma.riwaya || '', durationDays: khatma.durationDays };
          showNewKhatmaForm = true;
          render();
        }
      }, 50);
    }
  });

  document.getElementById('numeralSelect').addEventListener('change', async (e)=>{
    state.numeralSystem = e.target.value;
    await saveState();
    render();
  });

  document.getElementById('themeSelect').addEventListener('change', async (e)=>{
    state.theme = e.target.value;
    applyTheme();
    await saveState();
    render();
  });

  document.getElementById('calendarSelect').addEventListener('change', async (e)=>{
    state.calendarPref = e.target.value;
    await saveState();
    render();
  });

  if(document.getElementById('khatmaViewSelect')){
    document.getElementById('khatmaViewSelect').addEventListener('change', (e)=>{
      const v = e.target.value;
      selectedKhatmaIdx = v === 'current' ? null : parseInt(v, 10);
      render();
    });
  }

  if(fileLinkStatus === 'linked'){
    document.getElementById('unlinkBtn').addEventListener('click', unlinkFile);
  }

  const googleSignInBtn = document.getElementById('googleSignInBtn');
  if(googleSignInBtn) googleSignInBtn.addEventListener('click', signInWithGoogle);
  const googleSignOutBtn = document.getElementById('googleSignOutBtn');
  if(googleSignOutBtn) googleSignOutBtn.addEventListener('click', signOutGoogle);

  document.getElementById('exportBtn').addEventListener('click', async ()=>{
    await downloadJSON('khatm-' + todayStr() + '.json', JSON.stringify(state, null, 2));
  });

  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFileInput').click();
  });

  document.getElementById('importFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const imported = JSON.parse(ev.target.result);
        const wasWarningBefore = versionWarning;
        const migrated = migrateIfNeeded(imported);
        if(!migrated){
          if(versionWarning){
            await appAlert('هذا الملف محفوظ بإصدار بيانات رقم ' + versionWarning.fileVersion + '، وهو أحدث من إصدار هذا التطبيق (رقم ' + APP_DATA_VERSION + '). حدّث ملف HTML أولًا قبل استيراده.');
          } else {
            await appAlert('الملف غير صالح.');
          }
          versionWarning = wasWarningBefore; // لا يؤثر هذا الاستيراد الفاشل على حالة التطبيق الحالية
          return;
        }
        versionWarning = null;
        state = migrated;
        applyTheme();
        await saveState();
        render();
      }catch(err){
        await appAlert('تعذّرت قراءة الملف. تأكد أنه ملف JSON صحيح تم تصديره من هذه الأداة.');
      }
    };
    reader.readAsText(file);
  });
}

loadState().then(checkForUpdate);
</script>
</body>
</html>
