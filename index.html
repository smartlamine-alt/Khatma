<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ختمتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132821;
    --panel:#1B362D;
    --panel-2:#20402F;
    --parchment:#EFE6D2;
    --parchment-dim:#C9BFA9;
    --gold:#C7A24A;
    --gold-dim:#8C7638;
    --behind:#C1594B;
    --ahead:#6FA287;
    --hairline: rgba(239,230,210,0.14);
    --bg-a:#1F3F30;
    --bg-b:#132821;
    --over-yellow:#F2D23C;
  }
  :root[data-theme="midnight"]{
    --ink:#0F1B2D;
    --panel:#152840;
    --panel-2:#1B3352;
    --parchment:#E7ECF5;
    --parchment-dim:#9FB0C8;
    --gold:#7EA8D8;
    --gold-dim:#4C6E93;
    --behind:#D9756B;
    --ahead:#7CC4A4;
    --hairline: rgba(231,236,245,0.14);
    --bg-a:#1B3352;
    --bg-b:#0F1B2D;
  }
  :root[data-theme="sepia"]{
    --ink:#241A12;
    --panel:#33261A;
    --panel-2:#3D2D1E;
    --parchment:#F0E4D0;
    --parchment-dim:#C7B394;
    --gold:#C99A4B;
    --gold-dim:#8A6229;
    --behind:#C4695A;
    --ahead:#8AA97C;
    --hairline: rgba(240,228,208,0.14);
    --bg-a:#3D2D1E;
    --bg-b:#241A12;
  }
  :root[data-theme="ivory"]{
    --ink:#F6F1E4;
    --panel:#FFFFFF;
    --panel-2:#F2ECDB;
    --parchment:#241E12;
    --parchment-dim:#6B6252;
    --gold:#A9822E;
    --gold-dim:#8F6C24;
    --behind:#B23B2B;
    --ahead:#2E7D50;
    --hairline: rgba(36,30,18,0.12);
    --bg-a:#FBF7EC;
    --bg-b:#F0E9D6;
    --over-yellow:#B58900;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
  body{
    background: radial-gradient(1200px 600px at 80% -10%, var(--bg-a) 0%, var(--bg-b) 55%);
    color: var(--parchment);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding: 28px 16px 60px;
    line-height:1.6;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }

  /* ترويسة مثبَّتة (تبقى ظاهرة أعلى الصفحة دومًا) أثناء التمرير داخل صفحة كاملة طويلة (مثل نموذج "إضافة برنامج" أو نافذة
     "الفوائد المقيدة")؛ خلفية شبه معتمة + طمس خلفي حتى لا يظهر المحتوى المُمرَّر من تحتها متداخلًا مع نصّها. */
  header.top{ margin-bottom: 12px; text-align:center; position:sticky; top:0; z-index:40; background: color-mix(in srgb, var(--bg-b) 90%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding-top:6px; }
  /* flex-wrap:wrap (بدل nowrap سابقًا) — على الشاشات الضيقة ينزل سطر الحقوق (فكرة وتصميم...) إلى سطر خاص به بدل إجبار الصف كله على عرض واحد أوسع من الشاشة، وهو ما كان يُحدِث انزياحًا أفقيًا لكل الصفحة على الجوال؛ overflow-x:hidden على html/body أعلاه يبقى شبكة أمان إضافية بصرف النظر عن أي سبب آخر محتمل للفيض الأفقي. */
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap: 8px; flex-wrap: wrap; }
  .header-cluster{ display:flex; align-items:baseline; gap: 6px; flex:1 1 auto; min-width:0; flex-wrap:wrap; }
  .app-logo{ width: 30px; height: 30px; object-fit: contain; flex-shrink:0; align-self:center; }
  .version-tag{ color: var(--gold); font-size: 11px; }
  h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size: 26px;
    margin: 0;
    color: var(--parchment);
    line-height:1;
  }
  .credit-line{ color: var(--parchment-dim); font-size: 10px; line-height:1.35; text-align: left; flex-shrink:0; }
  .sub{ color: var(--parchment-dim); font-size: 14.5px; margin-top:6px; }

  section{
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .status-banner{
    text-align:center;
    font-size: 15.5px;
    font-weight:700;
    padding: 14px 18px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--hairline);
  }
  .status-banner.status-ahead{ color: var(--ahead); background: rgba(111,162,135,0.10); border-color: rgba(111,162,135,0.3); }
  .status-banner.status-behind{ color: var(--behind); background: rgba(193,89,75,0.10); border-color: rgba(193,89,75,0.3); }
  .status-banner.status-onpace{ color: var(--parchment); background: rgba(239,230,210,0.06); }

  .hero{
    padding: 26px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(199,162,74,0.09), transparent 60%);
    pointer-events:none;
  }
  table.metrics{
    width:100%;
    border-collapse: collapse;
    position:relative;
  }
  table.metrics th{
    text-align:center;
    font-size: 13px;
    font-weight:500;
    color: var(--parchment-dim);
    padding-bottom: 12px;
    border: none;
  }
  table.metrics th:first-child{ width: 78px; }
  table.metrics td{
    text-align:center;
    padding: 8px 4px;
    border:none;
  }
  table.metrics td.row-label{
    text-align: start;
    font-size: 13px;
    color: var(--parchment-dim);
    font-weight:500;
  }
  table.metrics .row-remaining td:not(.row-label){
    font-family:'Amiri', serif;
    font-weight:700;
    font-size: 30px;
    line-height:1;
    direction: ltr;
    color: var(--parchment);
  }
  table.metrics td .pct{
    display:block;
    font-family:'Tajawal', sans-serif;
    font-weight:500;
    font-size: 12px;
    color: var(--parchment-dim);
    margin-top: 3px;
  }

  .note.center{ text-align:center; }
  select, option{ direction: rtl; text-align: right; }
  .local-backup-row{ display:flex; align-items:center; gap:8px; margin:16px 0; }
  .local-backup-row span{ font-size:13px; color:var(--parchment-dim); }
  .mushaf-line{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--parchment-dim); margin:-4px 0 10px; flex-wrap:wrap; }
  .mushaf-line button{ padding:2px 12px; font-size:12.5px; }
  .mushaf-line select{ width:auto; font-size:12.5px; padding:3px 6px; }
  [data-tip]{ position:relative; }
  [data-tip]::after{ content: attr(data-tip); position:absolute; bottom:calc(100% + 6px); right:50%; transform:translateX(50%) scale(.95); background:#111; color:#fff; font-size:11.5px; padding:4px 8px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .05s linear, transform .05s linear; z-index:50; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after{ opacity:1; transform:translateX(50%) scale(1); }
  .surah-picker-btn{ width:100%; text-align:start; background: var(--panel-2); border: 1px solid var(--hairline); color: var(--parchment); padding: 10px 12px; border-radius: 8px; font-family:'Tajawal', sans-serif; font-size: 15px; cursor:pointer; }
  .surah-picker-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .surah-picker-btn:focus{ outline: 2px solid var(--gold-dim); outline-offset: 1px; }
  .surah-picker-panel{ z-index:1200; overflow-y:auto; background: var(--panel-2); border: 1px solid var(--hairline); border-radius: 8px; box-shadow:0 10px 28px rgba(0,0,0,.45); font-family:'Tajawal', sans-serif; font-size: 14px; }
  .surah-picker-item{ padding:8px 12px; cursor:pointer; border-bottom:1px solid color-mix(in srgb, var(--hairline) 60%, transparent); }
  .surah-picker-item:last-child{ border-bottom:none; }
  .surah-picker-item:hover{ background: color-mix(in srgb, var(--gold) 18%, transparent); }
  .surah-picker-item.active{ background: var(--gold); color: var(--ink); font-weight:700; }
  section.hero.just-saved{ animation: heroSavedFlash 1.6s ease-out; }
  @keyframes heroSavedFlash{ 0%{ background: color-mix(in srgb, var(--ahead) 38%, var(--panel)); } 100%{ background: var(--panel); } }
  .field-locked{ opacity:.4; pointer-events:none; }
  .yt-btn{ gap:5px; text-decoration:none; font-size:7.5px; font-weight:400; padding:0 14px; white-space:nowrap; line-height:1; }
  #helpBtn{ font-size:11px; font-weight:400; padding:0 8px; white-space:nowrap; line-height:1; }
  #contactBtn{ gap:5px; font-size:11px; font-weight:400; padding:0 10px; white-space:nowrap; line-height:1; }
  #contactBtn svg{ flex-shrink:0; }
  h1.top-nav{ display:flex; gap:6px; align-items:center; margin:0; }
  .header-cluster{ align-items:center; }
  .nav-btn{ display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; height:34px; }
  .nav-btn:not(.aux-nav){ font-family:'Amiri', serif; font-size:19px; font-weight:700; line-height:1; padding:0 12px; border-radius:9px; background:transparent; color:var(--parchment-dim); border:1px solid var(--hairline); }
  .aux-nav{ border-radius:9px; background:transparent; color:var(--parchment-dim); border:1px solid var(--hairline); }
  .suggestion-btn{ gap:5px; color:var(--gold); border-color: color-mix(in srgb, var(--gold) 55%, var(--hairline)); background: color-mix(in srgb, var(--gold) 10%, transparent); transition: background .15s, color .15s; text-decoration:none; }
  .suggestion-btn svg{ width:16px; height:16px; }
  .suggestion-btn:hover{ background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--parchment); }
  .nav-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  #app > [hidden]{ display:none !important; }
  .tuto-card{ position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:1000; width:min(460px, calc(100% - 24px)); background: color-mix(in srgb, var(--bg-b) 72%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color:var(--parchment); border:1px solid var(--hairline); border-radius:16px; padding:12px 16px 12px; box-shadow:0 10px 32px rgba(0,0,0,.45); }
  .tuto-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .tuto-kicker{ font-size:12px; color:var(--parchment-dim); }
  .tuto-mini{ display:flex; gap:6px; }
  .tuto-mini button{ padding:1px 9px; font-size:12px; border-radius:7px; }
  .tuto-card h3{ margin:0 0 6px; font-family:'Amiri', serif; font-size:21px; color:var(--gold); }
  .tuto-card p{ margin:0 0 10px; line-height:1.8; font-size:14px; max-height:32vh; overflow:auto; }
  .tuto-card p a{ color:var(--gold); text-decoration:underline; }
  .tuto-card p a:hover{ color:var(--parchment); }
  .tuto-dots{ display:flex; gap:5px; justify-content:center; margin-bottom:10px; }
  .tuto-dots span{ width:7px; height:7px; border-radius:50%; background:var(--hairline); }
  .tuto-dots span.on{ background:var(--gold); }
  .tuto-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .dlg-backdrop{ position:fixed; inset:0; z-index:1100; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; padding:16px; }
  .dlg-backdrop .tuto-card{ position:relative; left:auto; bottom:auto; transform:none; width:min(440px, 100%); }
  .dlg-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .dlg-choices-list{ display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto; margin:10px 0; }
  .dlg-choices-list .dlg-choice{ width:100%; text-align:right; white-space:normal; line-height:1.4; padding:8px 10px; }
  .tuto-chip{ position:fixed; bottom:12px; right:12px; z-index:1000; padding:6px 12px; border-radius:999px; font-size:13px; background: color-mix(in srgb, var(--bg-b) 80%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border:1px solid var(--gold); color:var(--parchment); }
  .tuto-arrow{ position:fixed; z-index:1001; pointer-events:none; display:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); animation: tutoBounce .9s ease-in-out infinite; }
  @keyframes tutoBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(7px); } }
  .perm-dim{ opacity:.3; filter:grayscale(1); pointer-events:none; user-select:none; }
  .perm-banner{ position:sticky; top:8px; z-index:5; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  table.khatma-list{ font-size:12px; }
  table.khatma-list th{ padding:0 3px 6px; font-size:11.5px; white-space:nowrap; }
  table.khatma-list td{ padding:5px 3px; white-space:nowrap; line-height:1.3; }
  table.khatma-list .date-text{ display:inline; padding:0; font-size:12px; }
  table.khatma-list .sub-date{ display:inline; font-size:11px; }
  table.khatma-list .tag{ font-size:11px; padding:1px 7px; }
  table.khatma-list button.ghost{ padding:2px 6px; font-size:12px; border-radius:6px; margin:0; }
  .old-round .date-text{ display:inline; padding:0; font-size:12.5px; }
  .khatma-group-row td{ padding-top:14px; font-size:15px; border-bottom:1px solid var(--hairline); }
  .old-round{ display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--parchment-dim); }
  .old-round button{ padding:2px 10px; font-size:14px; }
  .ledger-table tr.over-quota td{ color: var(--over-yellow); }
  /* سجل الختمة وسجل النشاطات: خلفية متناوبة لكل يوم (العادية ثم أفتح قليلًا) */
  .ledger-table tr.day-alt td, .activity-log-table tr.day-alt td{ background: rgba(255,255,255,.05); }
  [data-theme="ivory"] .ledger-table tr.day-alt td, [data-theme="ivory"] .activity-log-table tr.day-alt td{ background: rgba(0,0,0,.04); }
  .ledger-table tr.under-quota td{ color: var(--behind); }

  .bars{ margin-top: 24px; text-align: start; }
  .bar-row{ margin-bottom: 12px; }
  .bar-row .bar-label{
    display:flex; justify-content:space-between;
    font-size: 12.5px; color: var(--parchment-dim); margin-bottom: 5px;
  }
  .bar-track{
    height: 8px; border-radius: 5px;
    background: rgba(239,230,210,0.10);
    overflow:hidden;
  }
  .bar-fill{ height:100%; border-radius:5px; transition: width .5s ease; }
  .bar-fill.time{ background: var(--parchment-dim); }
  .bar-fill.time.overdue{ background: var(--behind); }
  .bar-fill.progress{ background: var(--gold); }

  h2{
    font-family:'Amiri', serif;
    font-size: 20px;
    margin: 0 0 16px;
    color: var(--parchment);
    font-weight:700;
  }
  label{
    display:block;
    font-size: 13px;
    color: var(--parchment-dim);
    margin-bottom: 6px;
  }
  .row{ display:flex; gap: 12px; margin-bottom: 14px; }
  .row.date-row{ gap: 4px; margin-bottom: 6px; flex-wrap: nowrap; }
  .row.date-row .field{ text-align: center; min-width: 0; }
  .row.date-row .field label{ display:block; text-align:center; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.date-row .field input{ text-align: center; padding-left: 4px; padding-right: 4px; }
  .date-row-with-title{ align-items: flex-end; }
  .date-row-with-title .inline-title{ margin:0 0 6px; flex: 0 0 auto; white-space: nowrap; }
  .date-row-with-title .field{ flex: 1 1 0; }
  .date-hint{ font-size: 10.5px; color: var(--parchment-dim); margin-top: 3px; text-align: center; }
  .hijri-single{ width: 100%; text-align: center; direction: ltr; }
  .field{ flex:1; min-width:0; }
  .hero-row{ align-items: flex-end; flex-wrap: wrap; }
  .hero-row .field-ayah{ flex: 0 0 78px; }
  .hero-row .field-date{ flex: 0 0 152px; }
  .hero-row .field-btn{ flex: 0 0 auto; }
  .hero-row .field-btn button{ white-space:nowrap; }
  select, option, input[type="number"], input[type="text"], input[type="date"], input[type="url"]{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--hairline);
    color: var(--parchment);
    padding: 10px 12px;
    border-radius: 8px;
    font-family:'Tajawal', sans-serif;
    font-size: 15px;
  }
  select:focus, input:focus{ outline: 2px solid var(--gold-dim); outline-offset: 1px; }
  header.top.header-inert{ pointer-events:none; opacity:.55; user-select:none; }
  .drive-badge{ font-size:11px; padding:1px 6px; border-radius:8px; border:1px solid var(--hairline); white-space:nowrap; align-self:center; }
  .drive-badge.ok{ color: var(--ahead); }
  .drive-badge.pending{ color: var(--gold); }
  .drive-badge.error{ color:#fff; background: var(--behind); border-color: var(--behind); cursor:pointer; }
  /* قوائم الاختيار بألوان التطبيق (select[data-csel]) */
  .csel-btn{ display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; background: var(--panel-2); border:1px solid var(--hairline); color: var(--parchment); padding:10px 12px; border-radius:8px; font-family:'Tajawal', sans-serif; font-size:15px; text-align:right; cursor:pointer; min-width:0; }
  .csel-btn .csel-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .csel-btn .csel-arrow{ color: var(--gold); font-size:12px; flex:0 0 auto; }
  .csel-btn:disabled{ opacity:.55; cursor:not-allowed; }
  .csel-btn:focus-visible{ outline: 2px solid var(--gold-dim); outline-offset: 1px; }
  .csel-panel{ position:fixed; z-index:3000; overflow-y:auto; background: var(--panel); border:1px solid var(--gold-dim); border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.5); padding:4px; direction:rtl; }
  .csel-opt{ padding:10px 12px; border-radius:6px; color: var(--parchment); font-family:'Tajawal', sans-serif; font-size:15px; cursor:pointer; white-space:pre-wrap; }
  .csel-panel[style*="nowrap"] .csel-opt{ white-space:pre; }
  .csel-opt:hover{ background: var(--panel-2); }
  .csel-opt.selected{ background: var(--panel-2); color: var(--gold); font-weight:700; }
  .csel-opt.disabled{ opacity:.45; cursor:default; }
  .csel-search{ position:sticky; top:0; z-index:1; width:100%; margin:0 0 4px; padding:8px 10px; border-radius:6px; background: var(--panel-2); border:1px solid var(--gold-dim); color: var(--parchment); font-family:'Tajawal', sans-serif; font-size:15px; box-sizing:border-box; }
  input:disabled{ opacity: 0.55; cursor: not-allowed; }
  select:disabled{ opacity: 0.55; cursor: not-allowed; }
  select option:disabled{ color: #999; }
  /* إزالة أسهم الزيادة/الإنقاص من خانات الأرقام في كل المتصفحات، ليبقى الإدخال بالكتابة المباشرة فقط. */
  input[type="number"]{ -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }

  button{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size: 15px;
    padding: 11px 20px;
    border-radius: 9px;
    border: none;
    cursor:pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  button.primary{ background: var(--gold); color: var(--ink); }
  button.primary:hover{ filter: brightness(1.08); }
  button.ghost{
    background: transparent;
    color: var(--parchment-dim);
    border: 1px solid var(--hairline);
  }
  button.ghost:hover{ color: var(--parchment); border-color: var(--gold-dim); }
  button.ghost.active{ background: var(--gold); color: var(--ink); border-color: var(--gold); }
  button.ghost.active:hover{ color: var(--ink); }
  button:active{ transform: scale(0.98); }
  button:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .actions{ display:flex; gap: 10px; flex-wrap:wrap; }

  .section-divider{
    border-top: 1px dashed var(--hairline);
    margin: 20px 0;
  }
  .overdue-count{ color: var(--behind); font-weight:700; }
  .overdue-note{ color: var(--behind); font-weight:700; font-size: 12.5px; }
  .ahead-note{ color: var(--ahead); font-weight:700; font-size: 12.5px; }

  .new-khatma-form{
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--hairline);
  }

  .sec-header-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .sec-header-row h2{ margin:0; }
  #bookForm{ margin-top:6px; padding-top:8px; }
  #bookForm h3{ margin:0 0 6px; }
